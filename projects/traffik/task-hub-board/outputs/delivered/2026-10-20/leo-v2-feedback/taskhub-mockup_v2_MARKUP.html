.hs-filter-note-actions{display:inline-flex;flex-wrap:wrap;gap:12px;margin-left:auto}

@media (max-width:720px){.ds-feed-row{grid-template-columns:16px minmax(0,1fr) auto;row-gap:4px}.ds-feed-when{grid-column:2;grid-row:2}.ds-feed-read{grid-column:3;grid-row:1 / span 2}}
/* Phone nav. At 390 the five labels need about 360px and the strip has 243 beside the mark, New Task and the avatar,
   so under 720 they move to a bottom tab bar where all five show at once. The top strip keeps its 56px height,
   which the sticky Run standup bar is offset against. */
@media (max-width:720px){
.side .side-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom));overflow:visible;-webkit-mask-image:none;mask-image:none;background:var(--side-bg);border-top:1px solid var(--hdr-line)}
.side .side-nav .side-btn{flex-direction:column;justify-content:center;gap:4px;width:auto;min-width:0;height:52px;padding:0 4px;border-radius:8px;font-size:11px;text-align:center}
.side .side-nav .side-btn svg{display:block;width:20px;height:20px}
.side .side-nav .side-label{max-width:100%;line-height:16px}
.side-label-pre{display:none}
body .side .side-cta{margin-left:auto}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
/* Seven cards at 104px stacked 2-up ran about 460px before any work. Tighter on a phone, 36px figures stay above 720. */
.hs-summary{gap:8px}
.hs-stat{gap:8px;min-height:76px;padding:12px}
.hs-stat-fig{font-size:32px}
}
/* ---------- Wave 2 E: standup focus mode, Day view, Move picker ---------- */
/* Start standup sits after the view tabs in the same raised pill, so it reads as an action beside the tabs. */
.db-hot-heading>.masthead{margin-right:auto}
.suf-start{display:inline-flex;align-items:center;gap:8px;min-height:47px;margin-left:-12px;padding:0 16px;border:0;border-radius:12px;background:var(--bg-canvas);box-shadow:var(--card-shadow);color:var(--text-primary);font:600 12px/1.4 var(--font-sans);white-space:nowrap}
.suf-start .dv-ic{color:var(--brand-red)}
@media (hover:hover){.suf-start:hover{background:var(--bg-hover)}}
.dv-ic{flex:none;width:16px;height:16px}
/* Standup focus layer. One person fills the screen; Previous, Next and End stay pinned to the bottom. */
.suf{width:min(1040px,calc(100vw - 32px));max-width:none;height:fit-content;max-height:calc(100dvh - 32px);margin:auto;padding:0;border:0;border-radius:16px;background:var(--bg-app);color:var(--text-primary);box-shadow:var(--shadow-menu);overflow:auto}

.suf-pos{margin:0;font:600 13px/1.3 var(--font-sans);color:var(--text-secondary);font-variant-numeric:tabular-nums}
.suf-bar{height:3px;margin:0 32px;border-radius:2px;background:var(--border-hairline);overflow:hidden}
.suf-bar>span{display:block;height:100%;background:var(--brand-red);transition:width var(--motion-standard) ease}
.suf-who{display:flex;align-items:center;gap:16px;padding:24px 32px 0}
.suf-av{display:grid;place-items:center;flex:none;width:56px;height:56px;border-radius:var(--r-circle);background:var(--hot-ink);color:var(--bg-canvas);font:600 18px/1 var(--font-sans);letter-spacing:0.02em}
.suf-name{margin:0;font:500 40px/1.05 var(--font-display);letter-spacing:-0.03em}
.suf-name:focus{outline:none}
.suf-name:focus-visible{outline:2px solid var(--hot-ink);outline-offset:4px;border-radius:4px}
.suf-team{margin:6px 0 0;font-size:13px;color:var(--text-secondary)}
.suf-secs{display:grid;flex:1;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;gap:16px;padding:24px 32px}
.suf-sec{min-width:0;padding:16px;border:1px solid var(--border-hairline);border-radius:12px;background:var(--bg-canvas)}
.suf-sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-secondary)}
.suf-sec-n{font:600 13px/1 var(--font-sans);letter-spacing:0;color:var(--text-primary);font-variant-numeric:tabular-nums}
.suf-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.suf-item{display:flex;flex-direction:column;gap:2px;padding:4px 0 4px 12px;border-left:3px solid color-mix(in srgb,var(--week-client) 70%,transparent)}
.suf-item-client{font:var(--fw-label) 10.5px/1.4 var(--font-label);letter-spacing:0.07em;text-transform:uppercase;color:color-mix(in srgb,var(--week-client) var(--client-ink-pct),var(--text-primary))}
.suf-item-title{font:600 14px/1.35 var(--font-sans)}
.suf-item-parent{font-size:12px;line-height:1.35;color:var(--text-tertiary)}
.suf-item-why{font:600 12px/1.3 var(--font-sans);color:var(--status-danger)}
.suf-empty{margin:0;font-size:13px;color:var(--text-tertiary)}
.suf-nav{position:sticky;bottom:0;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:16px 32px;border-top:1px solid var(--border-hairline);background:var(--bg-app)}
.suf-nav .btn-secondary{min-height:40px;padding:0 16px}
.suf-nav .btn-secondary:disabled{opacity:.45;cursor:default}
.suf-nav .suf-next{border-color:var(--hot-ink);background:var(--hot-ink);color:var(--bg-canvas)}
.suf-hint{margin:0 0 0 8px;font-size:12px;color:var(--text-tertiary)}
.suf-nav .suf-end{margin-left:auto}

/* Day view */
.dv-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;margin:0 0 16px}

.dv-card-title{font:600 16px/1.3 var(--font-sans);letter-spacing:-0.01em}
.dv-card-parent{margin-top:-4px;font-size:12px;line-height:1.35;color:var(--text-tertiary)}

/* Round 8l (Leo's Executive note). No As of line under the tabs: the scope statement sits in the band's third group
   label; the Needs attention group loses its tint, so only a pressed tile reads as pressed; the two charts sit right
   under the band, above Past due. */
.exh-band .exh-g-attention,.exh-band .exh-band-h.exh-g-attention{background:transparent}

/* Round 8m (Leo's band and sidebar note). The band keeps one hairline per group, running the full height through the
   label and the numbers, with nothing between the tiles of a group and no line under the labels. The sidebar loses the
   Workspace label, its nav rows are 44px squares that sit at the same height open and compact, the wordmark and the
   labels fade and slide in on a longer curve, and the bar gets a quieter finish. */
.exh-band .exh-stat,.exh-band .exh-g-first,.exh-band .exh-stat[data-exh-stat="overdue"]{box-shadow:none}
.exh-band-h,.exh-band .exh-g-first{box-shadow:inset 1px 0 0 rgba(255,255,255,.22)}
.exh-band .exh-band-h.exh-g-attention,.exh-band .exh-stat[data-exh-stat="overdue"]{box-shadow:none}

@media (max-width:1180px){.exh-band .exh-stat,.exh-band .exh-g-first{box-shadow:none}.exh-band .exh-stat:nth-child(n+8){box-shadow:inset 0 1px 0 var(--hdr-div)}}

/* Round 8n (Leo's Executive note). Both charts are rings with a legend that carries the count and the share: open work
   by account on the left with one segment per account, open projects by status on the right. The legend folds into two
   columns when it is long, so the two panels stand at one height. */
.exh-donut-wrap{grid-template-columns:172px minmax(0,1fr);gap:22px;align-items:center}

.exh-charts.exh-charts-2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}

   their name; the cards inside sit on a neutral surface with a grey hairline, and the client's name carries the
   client's colour. The Weekly board keeps its client tinted cards, since its day columns carry no colour. */
.db-stat-board .db-week-day{background:color-mix(in srgb,var(--st-ink) 8%,var(--bg-canvas));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--st-ink) 14%,transparent)}

.db-stat-board .db-week-day-name::before{display:none}
.db-stat-board .db-week-day-name{color:color-mix(in srgb,var(--st-ink) 78%,var(--text-primary))}
.db-stat-board .db-stat-n{border-color:color-mix(in srgb,var(--st-ink) 30%,transparent);background:var(--bg-canvas)}
.db-stat-board .db-week-card{border-color:var(--border-hairline);background:var(--bg-canvas);box-shadow:0 1px 2px rgba(10,10,12,0.05)}
.db-stat-board .db-week-card.is-done{background:var(--bg-subtle)}
.db-stat-board .db-week-card:not(.is-hold):hover{box-shadow:0 0 0 1px var(--border-strong),0 14px 28px -12px rgba(10,10,12,0.35)}
.db-hot-shell .db-stat-board .db-week-card:focus-visible{border-color:var(--text-primary)}
.db-stat-board .db-week-card-client{color:color-mix(in srgb,var(--week-client) 88%,var(--text-primary))}

/* Round 8r (the suite's accessibility check on 8p). The band's group labels sat at 4.49 to 1 against the band; they
   read at 56 percent white now, past the 4.5 the check wants, in both themes. */
.exh-band-h,.exh-band-h.exh-g-attention,.exh-band .exh-band-h.exh-g-attention{color:rgba(255,255,255,.56)}
.exh-band .exh-scope-note{color:rgba(255,255,255,.56)}
/* Round 8s (Leo's column colours note). One clear hue per status on the Status board: slate for the queue, teal for
   Intake, blue for In progress, violet for Internal review, magenta for Quality Control, dark gold for With client, orange
   for On hold, green for Complete. A light tint on the column, the name and the count in that hue, darkened in light
   and lifted in dark so they read. */
.db-stat-board .db-week-day.st-k-queue{--col:#5B6B86}
.db-stat-board .db-week-day.st-k-intake{--col:#0E8A8A}

.db-stat-board .db-week-day.st-k-review{--col:#7C3AED}
.db-stat-board .db-week-day.st-k-qc{--col:#C026D3}
.db-stat-board .db-week-day.st-k-client{--col:#A16207}
.db-stat-board .db-week-day.st-k-hold{--col:#EA580C}
.db-stat-board .db-week-day.st-k-done{--col:#16A34A}

.db-stat-board .db-week-day.is-over{background:color-mix(in srgb,var(--col) 20%,var(--bg-canvas));box-shadow:inset 0 0 0 2px var(--col)}
.db-stat-board .db-week-day-name{color:color-mix(in srgb,var(--col) 76%,#000000)}
.db-stat-board .db-stat-n{border-color:color-mix(in srgb,var(--col) 35%,transparent);background:var(--bg-canvas);color:color-mix(in srgb,var(--col) 78%,#000000)}
.db-stat-board .db-week-list.is-empty{border-color:color-mix(in srgb,var(--col) 35%,transparent)}
:root[data-theme="dark"] .db-stat-board .db-week-day{background:color-mix(in srgb,var(--col) 17%,var(--bg-canvas))}
:root[data-theme="dark"] .db-stat-board .db-week-day.is-over{background:color-mix(in srgb,var(--col) 28%,var(--bg-canvas))}
:root[data-theme="dark"] .db-stat-board .db-week-day-name,:root[data-theme="dark"] .db-stat-board .db-stat-n{color:color-mix(in srgb,var(--col) 55%,#FFFFFF)}

.suf-start{min-height:38px;margin-left:4px;padding:0 14px 0 12px;border-color:var(--text-primary);border-radius:10px;background:var(--text-primary);color:var(--bg-canvas);font:600 13px/1.3 var(--font-sans);gap:8px}

/* Round 8v (Leo's standup marks note). An Executive tab that gathers the marks the team clicks in the standup: a
   band of four counts, a ring of marks across open work, a ring of what is behind by account, a stacked bar per
   person, and the blocked and at risk items as records, blocked first. */
.exs-note{margin:0 0 16px;font-size:13px;line-height:1.45;color:var(--text-secondary)}

.exs-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg-subtle)}
.exs-bar i{display:block;height:100%}
.exs-bar .is-ok{background:var(--st-done-ink)}
.exs-bar .is-risk{background:var(--status-warn-ink)}
.exs-bar .is-blocked{background:var(--status-danger)}

.exs-person-c b{margin-right:4px;font-weight:650}

.exs-behind [data-k^="exr-risk-"] .exr-why{color:var(--status-warn-ink)}
.exs-legend .exh-legend-row{cursor:default}
@media (max-width:640px){.exs-person{grid-template-columns:minmax(0,1fr);gap:6px}.exs-person-c{white-space:normal}}

var MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// Dates are ISO strings, handled in UTC so the mockup reads the same in every time zone.
function D(s){var p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]));}
function iso(d){return d.toISOString().slice(0,10);}
function addDays(s,n){var d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d);}
function dow(s){return D(s).getUTCDay();}
function isWeekend(s){var w=dow(s);return w===0||w===6;}
function mondayOf(s){return addDays(s,-((dow(s)+6)%7));}
function dayNum(s){return D(s).getUTCDate();}
function fmtShort(s){var d=D(s);return MON3[d.getUTCMonth()]+' '+d.getUTCDate();}
function fmtLong(s){var d=D(s);return DAYS[d.getUTCDay()]+', '+MONTHS[d.getUTCMonth()]+' '+d.getUTCDate();}
function daysBetween(a,b){return Math.round((D(b)-D(a))/864e5);}
function prevWorkday(s){var d=addDays(s,-1);while(isWeekend(d))d=addDays(d,-1);return d;}
function weekLabel(start){return fmtShort(start)+' to '+fmtShort(addDays(start,4));}
function monthLabel(ym){return MONTHS[+ym.slice(5,7)-1]+' '+ym.slice(0,4);}
function shiftMonth(ym,n){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0');}
function monthEnd(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7);return iso(new Date(Date.UTC(y,m,0)));}
function firstWeekday(ym){var d=ym+'-01';while(isWeekend(d))d=addDays(d,1);return d;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c];});}
function plural(n,one,many){return n+' '+(n===1?one:many);}
function color(client){return (SEED.clients[client]||{}).color;}

/* ---------- Statuses ----------
   Eight statuses in the picker, In the queue first and Complete last. Active isn't one of them. On Home, Active
   leaves out In the queue, On hold and Complete, and Total open adds them back minus Complete. On hold stays a flag over the status underneath, as
   live's hold works today. Projects and steps use the same eight words. Ready and Feedback came out in round 5. */
var STATUSES = [['queue','In the queue'],['intake','Intake'],['progress','In progress'],['review','Internal review'],['qc','Quality Control'],['client','With client'],['hold','On hold'],['done','Complete']];
var STAGES = STATUSES.slice(0,6);
var DONE_DAYS = 7;
// The mapper. Live's words map across, and the retired ones still read: Ready lands in Intake, and Feedback plus
// Round 1 and Round 2 Edits land in In progress. Nothing already saved breaks.
var FROM_LIVE = {'In the queue':'queue','Intake':'intake','Ready':'intake','In progress':'progress','In Progress':'progress','Internal review':'review','Ready for Review':'review','Quality Control':'qc','With client':'client','Sent to Client':'client','Feedback':'progress','Round 1 Edits':'progress','Round 2 Edits':'progress','Complete':'done','On hold':'hold','On Hold':'hold'};
function keyOf(word,owners,due){
  if(word==='New')return ((owners&&owners.length)||due)?'intake':'queue';
  return FROM_LIVE[word]||'queue';
}
function fromLive(p){var k=keyOf(p.status,p.owners,p.due);p.hold=k==='hold';p.stage=p.hold?'progress':k;}
SEED.projects.forEach(fromLive);
function statusKey(p){return p.hold?'hold':p.stage;}
function statusName(k){for(var i=0;i<STATUSES.length;i++)if(STATUSES[i][0]===k)return STATUSES[i][1];return k;}
function statusIndex(k){for(var i=0;i<STATUSES.length;i++)if(STATUSES[i][0]===k)return i;return -1;}
function isActive(p){return !p.hold&&p.stage!=='done';}
// The status chip. One flat tint per status, the same chip on cards, rows and the dialog.

// Owner: two-letter initials in a circle with the first name beside it.

/* ---------- Data ---------- */
function proj(id){for(var i=0;i<SEED.projects.length;i++)if(SEED.projects[i].id===id)return SEED.projects[i];return null;}
function projectItem(p){
  return {kind:'project', id:p.id, client:p.client, title:p.title, owners:p.owners.slice(), start:p.start||null, due:p.due||null, status:statusKey(p), pri:!!p.pri, hold:p.hold, type:p.type, project:p, done:p.stage==='done', doneOn:p.stage==='done'?p.since:null, since:p.since, originalDue:p.originalDue||null, completedAt:(p.stage==='done'&&!p.hold)?(p.completedAt||null):null};
}
// A step reads its own status. On hold and Complete on the project cover its steps too.
function stepItem(s){
  var p=proj(s.p), own=s.done?'done':keyOf(s.status||'In the queue',s.owner?[s.owner]:[],s.due), pdone=p.stage==='done';
  return {kind:'step', id:s.id, client:p.client, title:s.title, parent:p.title, owners:s.owner?[s.owner]:[], start:s.start||null, due:s.due||null, done:own==='done'||pdone, doneOn:s.done||(pdone?p.since:null),
    stepKind:s.kind||'Step', status:p.hold?'hold':pdone?'done':own, own:own, pri:false, hold:p.hold, type:p.type, project:p, step:s, since:s.since||null, originalDue:s.originalDue||null, completedAt:own==='done'?(s.completedAt||null):null};
}
// Complete work stays on the boards for a week from the day it was marked, then leaves them.
// A Complete item with no date on it stays, since nobody can say when its week ends.
function archived(it){return !!it.done&&!!it.doneOn&&daysBetween(it.doneOn,TODAY)>=DONE_DAYS;}
// Every project and step, archived ones included. The boards read allItems(), which drops the archived. A direct
// link, a dialog and the project page read anyItems(), so Complete work stays reachable after it leaves the boards.
function anyItems(){return SEED.projects.map(projectItem).concat(SEED.steps.map(stepItem));}
function allItems(){return anyItems().filter(function(it){return !archived(it);});}
function projectItems(){return allItems().filter(function(it){return it.kind==='project';});}
function stepsOf(pid){return allItems().filter(function(it){return it.kind==='step'&&it.project.id===pid;}).sort(byDue);}
function findItem(id){var all=anyItems();for(var i=0;i<all.length;i++)if(all[i].id===id)return all[i];return null;}
// A project's own steps, archived ones included, for the project page and its dialog. The boards use stepsOf().
function projectSteps(pid){return SEED.steps.filter(function(s){return s.p===pid;}).map(stepItem).sort(byDue);}
// Moves an item to a status. A step can't go on hold by itself, since hold is set on the project, and a step
// under a held or complete project follows the project, so moving it alone is refused with a reason.
function stepLocked(it){
  if(it.kind!=='step')return null;
  if(it.project.hold)return it.title+' follows its project, which is on hold. Move the project.';
  if(it.project.stage==='done')return it.title+' follows its project, which is complete. Reopen the project first.';
  return null;
}
function applyStatus(it,k){
  var stB=stBriefBlock(it,k);if(stB){stRefuse(stB);return false;}
  if(it.kind==='project'){var p=it.project, wasDone=p.stage==='done'&&!p.hold;if(k==='hold'){p.hold=true;if(p.stage==='done')p.stage='progress';}else{p.hold=false;if(k==='client'){if(p.stage!=='client'||!p.sent)p.sent=TODAY;}else p.sent=null;p.stage=k;}if(p.stage==='done'&&!p.hold){if(!wasDone||!p.completedAt)p.completedAt=TODAY+'T12:00:00';}else delete p.completedAt;p.since=TODAY;return true;}
  if(k==='hold'||stepLocked(it))return false;
  var s=it.step;if(k==='done'){if(!s.done||!s.completedAt)s.completedAt=TODAY+'T12:00:00';s.done=TODAY;s.status='Complete';}else{delete s.done;delete s.completedAt;s.status=statusName(k);}
  s.since=TODAY;
  return true;
}
function clearFilters(){state.weeklyFilters={type:'All',client:'',members:[],mineOnly:false,unassigned:false};}
function passes(it,wf){
  if(wf.type&&wf.type!=='All'&&it.type!==wf.type)return false;
  if(wf.client&&it.client!==wf.client)return false;
  if(wf.mineOnly)return it.owners.indexOf(state.viewingAs)>-1;
  if(wf.unassigned)return it.owners.length===0;
  if(wf.members&&wf.members.length)return it.owners.some(function(o){return wf.members.indexOf(o)>-1;});
  return true;
}
// Complete work that's still inside its week stays on the boards with a Complete chip. allItems() already dropped the rest.
function openItems(){return allItems();}
// Who shares a team with name. Lead counts as part of their own team. Unknown name returns [name] so the filter still passes their own work.
function teamOf(name){
  var out={};
  SEED.teams.forEach(function(t){
    var roster=(t.lead?[t.lead]:[]).concat(t.members||[]);
    if(roster.indexOf(name)>-1)roster.forEach(function(p){out[p]=1;});
  });
  var keys=Object.keys(out);
  return keys.length?keys:[name];
}
function scopeAllows(it){
  if(state.scope!=='team')return true;
  var mates=stMates();
  if(!it.owners||!it.owners.length)return false;
  return it.owners.some(function(o){return mates.indexOf(o)>-1;});
}
function dbHotData(){var wf=state.weeklyFilters;return openItems().filter(function(it){return scopeAllows(it)&&passes(it,wf);});}
function sortItems(list){
  return list.slice().sort(function(a,b){
    if(a.kind!==b.kind)return a.kind==='project'?-1:1;
    if(a.client!==b.client)return a.client.localeCompare(b.client);
    return a.title.localeCompare(b.title);
  });
}
function byDue(a,b){return (a.due||'9').localeCompare(b.due||'9')||a.client.localeCompare(b.client)||a.title.localeCompare(b.title);}
function due(list,date){return sortItems(list.filter(function(it){return it.due===date;}));}
// Overdue follows live: open, past the committed date, not queued, paused or on hold. Moving Submit by never clears it.
// A step's queued state is its own. Paused and on hold come from its project, as on live.
var LATE_SKIP={queue:1,intake:1,review:1,client:1};
function lateKey(it){var p=it.project;if(it.kind!=='step'||!p)return it.status;if(p.hold)return 'hold';if(p.stage==='review'||p.stage==='client')return p.stage;return (it.own==='queue'||it.own==='intake')?it.own:'progress';}
function origDue(it){return it.originalDue||it.due||null;}
function isLate(it){var d=origDue(it);if(!d||d>=TODAY||it.done||it.hold)return false;var k=lateKey(it);return k!=='hold'&&!LATE_SKIP[k];}
// Past the committed date while paused with the client or in review: tagged, not overdue.
function isTagged(it){var d=origDue(it);if(!d||d>=TODAY||it.done||it.hold)return false;var k=lateKey(it);return k==='review'||k==='client';}
function split(list){var d=0,s=0;list.forEach(function(it){if(it.kind==='project')d++;else s++;});return {d:d,s:s};}

// Working span. Start date to due date, or to today when it's overdue. Weekdays only, so a weekend start
// moves to Monday and a weekend due date pulls back to Friday. Nothing with no due date gets a bar.
function span(it){
  if(!it.due)return null;
  var e=(isLate(it)&&it.due<TODAY)?TODAY:it.due, s=it.start||it.due;
  if(s>e)s=e;
  while(isWeekend(s))s=addDays(s,1);
  while(isWeekend(e))e=addDays(e,-1);
  if(s>e)s=e;
  return {s:s,e:e};
}
function seg(it,ws){
  var sp=span(it);if(!sp)return null;
  var we=addDays(ws,4);if(sp.e<ws||sp.s>we)return null;
  var a=sp.s<ws?ws:sp.s, b=sp.e>we?we:sp.e;
  return {it:it, sp:sp, c0:daysBetween(ws,a), c1:daysBetween(ws,b), l:sp.s<ws, r:sp.e>we};
}
// Lanes, packed top down. Deadlines before steps, then the bar that started first, then the longer one.
// Sorting on the bar's own start, not the week's, keeps a long bar in the same row week to week.
function pack(segs){
  segs.sort(function(a,b){
    if(a.it.kind!==b.it.kind)return a.it.kind==='project'?-1:1;
    if(a.sp.s!==b.sp.s)return a.sp.s<b.sp.s?-1:1;
    if(a.sp.e!==b.sp.e)return a.sp.e>b.sp.e?-1:1;
    return a.it.client.localeCompare(b.it.client)||a.it.title.localeCompare(b.it.title);
  });
  var lanes=[];
  segs.forEach(function(sg){
    for(var i=0;;i++){
      if(!lanes[i])lanes[i]=[0,0,0,0,0];
      var free=true;for(var c=sg.c0;c<=sg.c1;c++)if(lanes[i][c]){free=false;break;}
      if(free){for(c=sg.c0;c<=sg.c1;c++)lanes[i][c]=1;sg.lane=i;break;}
    }
  });
  return segs.sort(function(a,b){return a.lane-b.lane||a.c0-b.c0;});
}

// The inbox. Overdue, Due on the weekend, Needs a date, In the queue, On hold.
function dbHotInbox(list,weekStart){
  var sat=addDays(weekStart,5),sun=addDays(weekStart,6);
  return {
    overdue:list.filter(isLate), tagged:list.filter(isTagged),
    weekend:sortItems(list.filter(function(it){return it.due===sat||it.due===sun;})), sat:sat, sun:sun,
    nodate:list.filter(function(it){return !it.due&&!it.hold&&!it.done;}),
    queue:list.filter(function(it){return it.kind==='project'&&it.project.stage==='queue'&&!it.hold;}),
    hold:list.filter(function(it){return it.kind==='project'&&it.hold;}),
    // Anything open and not held with no owner on it.
    needSomeone:list.filter(function(it){return !it.hold&&!it.done&&(!it.owners||!it.owners.length);})
  };
}

function dbHotColumn(day){

// Day view follows the concept: the date and a count of projects and steps, then two panels. Due today holds

/* ---------- Calendar: Month ---------- */
function calWeeks(ym){
  var first=ym+'-01', last=monthEnd(ym), weeks=[];
  for(var w=mondayOf(first); w<=last; w=addDays(w,7)){
    var days=[0,1,2,3,4].map(function(i){return addDays(w,i);});
    if(days.some(function(d){return d.slice(0,7)===ym;}))weeks.push(days);
  }
  return weeks;
}
function calPeople(entries){
  var wf=state.weeklyFilters, picked=wf.members&&wf.members.length, base;
  if(wf.mineOnly)base=[state.viewingAs];else if(wf.unassigned)base=[];else if(picked)base=wf.members.slice();else base=standupPeople();
  if(!wf.mineOnly&&!picked)entries.forEach(function(x){x.it.owners.forEach(function(o){if(base.indexOf(o)<0)base.push(o);});});
  if(entries.some(function(x){return !x.it.owners.length;}))base.push('Unassigned');
  return base;
}
function ownedBy(name){return function(x){return name==='Unassigned'?!x.it.owners.length:x.it.owners.indexOf(name)>-1;};}
function rangeText(sp){return fmtShort(sp.s)+(sp.s===sp.e?'':' to '+fmtShort(sp.e));}
function barHTML(sg,k){
  var it=sg.it, late=isLate(it);
  var cls=['cb-bar', it.kind==='step'?'is-step':'', it.hold?'is-hold':'', sg.l?'is-cont-l':'', sg.r?'is-cont-r':''].filter(Boolean).join(' ');
  var sr='<span class="sr-only">, '+(it.kind==='project'?'project':'step')+', '+statusName(it.status)+(late?', overdue':'')+', working '+rangeText(sg.sp)+(sg.l?', started earlier':'')+(sg.r?', runs past this week':'')+'</span>';
  var L=sg.l?'<span class="cb-cont" aria-hidden="true">‹</span>':'', R=sg.r?'<span class="cb-cont is-r" aria-hidden="true">›</span>':'';
  return '<li class="cb-c'+(sg.c0+1)+' cb-s'+(sg.c1-sg.c0+1)+' cb-l'+(sg.lane+1)+(sg.l?' is-cl':'')+(sg.r?' is-cr':'')+'" data-c0="'+sg.c0+'" data-c1="'+sg.c1+'">'+
    '<button type="button" class="'+cls+'" style="--week-client:'+color(it.client)+'" data-item="'+it.id+'" data-k="'+k+'">'+
    L+'<span class="cb-client">'+esc(it.client)+'</span><span class="cb-title">'+esc(it.title)+'</span>'+(late?'<span class="db-week-card-late">Overdue</span>':'')+R+sr+'</button></li>';
}
function calSummary(list,from,to,label){
  var ids=[], d=0, s=0, late=0;
  list.forEach(function(it){var sp=span(it);if(!sp||sp.e<from||sp.s>to)return;ids.push(it.id);if(it.kind==='project')d++;else s++;if(isLate(it))late++;});
  // Chips carry the counts. How to read the bars sits behind an info control instead of a standing sentence.
  var lab=String(label||'').replace(/^in /,'');lab=lab.charAt(0).toUpperCase()+lab.slice(1);
  return '<span hidden data-gate="cal-sum" data-d="'+d+'" data-s="'+s+'" data-ids="'+ids.join(' ')+'"></span><div class="ws-info-row">'+
    wsInfoHTML('cal','How to read the bars','Each bar starts on its start date and ends on its due date. Weekends are skipped.')+'</div>';
}
function calMonthHTML(list){
  // Six lanes a week on Everyone. Any filter shows up to twelve, so one person's month reads in full.
  // "+N more" opens that week to every lane, and "Show fewer" folds it back.
  var ym=state.calMonth, wf=state.weeklyFilters, MAX=((wf.type&&wf.type!=='All')||wf.client||wf.mineOnly||wf.unassigned||(wf.members&&wf.members.length))?12:6;
  var weeks=calWeeks(ym).map(function(days){
    var ws=days[0], segs=pack(list.map(function(it){return seg(it,ws);}).filter(Boolean)), open=!!state.calOpen[ws], cap=open?Infinity:MAX;

// Read state is per viewer and lives in this browser only. Rows older than three days start out read.
var FEED_KEY='taskhub-mockup-feedread', FEED_DAYS=14;
function feedLoad(){try{var raw=localStorage.getItem(FEED_KEY), o=raw?JSON.parse(raw):null;state.feedRead=(o&&typeof o==='object')?o:{};}catch(e){state.feedRead=state.feedRead||{};}}
function feedSave(){try{localStorage.setItem(FEED_KEY,JSON.stringify(state.feedRead||{}));}catch(e){}}
function feedIsRead(fid,when){var m=(state.feedRead||{})[state.viewingAs];if(m&&Object.prototype.hasOwnProperty.call(m,fid))return !!m[fid];return !!when&&when<addDays(TODAY,-3);}
function feedSetRead(fid,on,noSave){var fr=state.feedRead||(state.feedRead={}), m=fr[state.viewingAs]||(fr[state.viewingAs]={});m[fid]=on?1:0;if(!noSave)feedSave();}
// A stable id from the row's content, so read state survives re-renders and reloads.
function feedId(str){var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return 'f'+(h>>>0).toString(36);}
function dsActivityRows(){
  var rows=[], seen={}, from=addDays(TODAY,-FEED_DAYS);
  function add(kind,it,when,what){if(!when||when<from||when>TODAY)return;var fid=feedId(kind+'|'+it.id+'|'+when+'|'+what);if(seen[fid])return;seen[fid]=1;rows.push({fid:fid,kind:kind,when:when,what:what,item:it});}
  anyItems().forEach(function(it){if(!haFeedAllows(it))return;activity(it).forEach(function(a){add(dsActivityKind(a.what),it,a.when,a.what);});});
  DS_COMMENTS.forEach(function(c){var it=findItem(c.item);if(it&&haFeedAllows(it))add('comment',it,c.when,esc(c.who)+': '+esc(c.text));});
  rows.sort(function(a,b){return b.when.localeCompare(a.when)||(a.fid<b.fid?-1:a.fid>b.fid?1:0);});
  return rows;
}

// One metric definition for both pages. Total open is Active plus In the queue plus On hold.
// Active leaves out queued, held and finished work, and With the client sits inside Active.
var HS_KEYS=[['open','Total open'],['active','Active'],['queue','In the queue'],['hold','On hold'],['overdue','Overdue'],['dueweek','Due this week'],['client','With the client']];
function hsPass(it,key,ws){
  if(!key)return true;
  if(key==='overdue')return isLate(it);
  if(it.done||it.status==='done')return false;
  if(key==='open')return true;
  var held=it.status==='hold'||!!it.hold;
  if(key==='hold')return held;
  if(held)return false;
  if(key==='queue')return it.status==='queue';
  if(key==='dueweek'){var w=ws||mondayOf(TODAY);return !!it.due&&it.due>=w&&it.due<=addDays(w,4);}
  if(it.status==='queue')return false;
  if(key==='client')return it.status==='client';
  return true;
}
function hsFilter(list,key,ws){return key?list.filter(function(it){return hsPass(it,key,ws);}):list;}
function hsCounts(list,ws){var c={};HS_KEYS.forEach(function(k){c[k[0]]=hsFilter(list,k[0],ws).length;});return c;}
function hsWeekLabel(ws){return (!ws||ws===mondayOf(TODAY))?'Due this week':'Due week of '+fmtShort(ws);}
function hsLabel(key,ws){if(key==='dueweek')return hsWeekLabel(ws);for(var i=0;i<HS_KEYS.length;i++)if(HS_KEYS[i][0]===key)return HS_KEYS[i][1];return key;}
function hsPhrase(key,ws){
  if(key==='dueweek')return (!ws||ws===mondayOf(TODAY))?'due this week':'due the week of '+fmtShort(ws);
  return {open:'open',active:'active',queue:'in the queue',hold:'on hold',overdue:'overdue',client:'with the client'}[key]||key;
}
// The line under the metrics while one is picked: what's showing, what the view hides, and a way out.
function hsNoteHTML(surface,key,n,hid,ws){
  var ph=hsPhrase(key,ws), msg=n?'Showing <strong>'+n+'</strong> '+(n===1?'item':'items')+' '+ph+'.':'Nothing is '+ph+(key==='dueweek'?'':' right now')+'.';
  if(hid>0){
    var where=state.hot==='day'?'the day shown':state.hot==='cal'?'the month shown':'the week shown';
    msg+=' '+(hid===n?(n===1?'It sits':'All of them sit'):hid+' of them '+(hid===1?'sits':'sit'))+' outside '+where+'.';
  }
  var acts='';
  if(surface==='ws'&&hid>0)acts+='<button type="button" class="db-link" data-hs-alldates data-k="hs-alldates">Show all dates</button>';
  if(surface==='home'&&n>0)acts+='<button type="button" class="db-link" data-hs-open-ws="'+key+'" data-k="hs-open-ws">Open in Workspace</button>';
  acts+='<button type="button" class="db-link" data-hs-clear="'+surface+'" data-k="hs-clear-'+surface+'">Clear filter</button>';
  return '<div class="hs-filter-note" role="status"><p>'+msg+'</p><span class="hs-filter-note-actions">'+acts+'</span></div>';
}

// audit #17, #18, #21: one Account lead, Account team, creative lead, reviewer, and the brief link
function tpOwnership(p){
  if(!p||p.kind==='step')return '';

  if(!hasAny)return '';
  function row(label,val,missing,extraCls){
    var cls=extraCls||'';

      return '<dt>'+label+'</dt><dd class="'+cls+' tp-own-missing">'+(missing||'Not set')+'</dd>';
    }

  }
  var teamHTML=p.accountTeam&&p.accountTeam.length?esc(p.accountTeam.join(', ')):'';

// audit #20: Quality Control checklist (five yes/no items). The old name was Pre-launch QA.
function tpQC(p){
  if(!p||p.kind==='step')return '';
  if(!p.qc)return '';
  var items=[['copy','Copy proofed'],['links','Links tested'],['specs','Specs match brief'],['legal','Legal cleared'],['delivery','Delivery packaged']];
  var done=items.reduce(function(n,r){return n+(p.qc[r[0]]?1:0);},0);
  var all=done===items.length;
  return '<section class="panel tp-qc" aria-labelledby="tpQCH"><h4 id="tpQCH">Quality Control<span class="tp-qc-count">'+done+' of '+items.length+'</span></h4>'+
    '<ul>'+items.map(function(r){var yes=!!p.qc[r[0]];return '<li><span class="tp-qc-dot '+(yes?'is-yes':'is-no')+'" aria-label="'+(yes?'Yes':'Not yet')+'">'+(yes?'✓':'')+'</span>'+esc(r[1])+'</li>';}).join('')+'</ul>'+
    '<p class="tp-qc-gate'+(all?'':' is-wait')+'">'+(all?'QC complete. Send or present is ready.':'These checks never block a status change. Clear the list before you send or present.')+'</p>'+
  '</section>';
}

// audit #21: Full track work cannot go active without a brief link.
function tpBriefGate(p){
  if(!p||p.kind==='step')return '';

}

/* ---------- Effort and capacity (Wave 2, shared by Executive and Resourcing) ---------- */
// Effort is hours of hands-on work. Elapsed days are the calendar span. They never mix, so 8h spread over 4 days is 8h.
// A project with steps counts its steps (3h + 5h = 8h). A project with no steps counts its own estimate.
// A missing estimate stays missing. Totals carry a count of pieces without one, and nothing reads it as zero.
// Review and client waiting time live on the timeline as elapsed days; they never add effort hours.
var EST={p1:44,p2:14,p12:10,p13:30,p14:6,p15:5,
  s1:6,s2:5,s3:4,s4:4,s5:2,s6:1,s7:3,s8:2,s9:5,s10:2,s13:16,s14:1,s15:6,s16:12,s17:3,s18:8,s19:1,s20:3,s21:5,s22:2,s23:3};
var DAY_HOURS={Valerie:6};
var TIME_OFF={Matt:['2026-10-16'],Julia:['2026-10-19','2026-10-20'],Jordan:['2026-10-23'],Connor:['2026-10-30'],Anthony:['2026-11-24','2026-11-25']};
var HOLIDAYS=['2026-11-26','2026-11-27','2026-12-24','2026-12-25','2027-01-01'];
function dayHours(name){return DAY_HOURS[name]!=null?DAY_HOURS[name]:8;}
function isHoliday(d){return HOLIDAYS.indexOf(d)>=0;}
function isOff(name,d){return (TIME_OFF[name]||[]).indexOf(d)>=0;}
function isWorkday(d){return !isWeekend(d)&&!isHoliday(d);}
function workdays(from,to){var out=[];for(var d=from;d<=to;d=addDays(d,1))if(isWorkday(d))out.push(d);return out;}
// Hours a person can work between two dates, inclusive, after weekends, holidays and their own time off.
function availHours(name,from,to){return workdays(from,to).filter(function(d){return !isOff(name,d);}).length*dayHours(name);}
function stepsFor(pid){return SEED.steps.filter(function(s){return s.p===pid;});}
// {h, missing}: h is the known hours, missing counts the pieces with no estimate.
function effortOf(it){
  var id=typeof it==='string'?it:it.id, kids=id.charAt(0)==='p'?stepsFor(id):[];
  if(kids.length){var h=0,m=0;kids.forEach(function(s){if(EST[s.id]!=null)h+=EST[s.id];else m++;});return {h:h,missing:m};}
  return EST[id]!=null?{h:EST[id],missing:0}:{h:0,missing:1};
}
// Schedulable pieces: every step, plus each project that has no steps. A project with steps would double count.
function workPieces(){return allItems().filter(function(it){return it.kind==='step'||!stepsFor(it.id).length;});}
// A piece's effort spread evenly over the working days from its start to its due date: {day: hours}.
function spread(it){
  var out={}, e=EST[it.id]; if(e==null||!it.due)return out;
  var days=workdays(it.start&&it.start<=it.due?it.start:it.due,it.due); if(!days.length)days=[it.due];
  days.forEach(function(d){out[d]=e/days.length;}); return out;
}
// Open effort a person has scheduled between two dates. Held and complete work is left out, a shared piece splits
// evenly between its owners, and pieces with no estimate or no due date are counted rather than guessed.
function scheduledHours(name,from,to){
  var h=0,missing=0,undated=0;
  workPieces().forEach(function(it){
    if(it.done||it.hold||it.owners.indexOf(name)<0)return;
    if(!it.due){undated++;return;}
    if(EST[it.id]==null){if(it.due>=from&&(it.start||it.due)<=to)missing++;return;}
    var sp=spread(it), n=it.owners.length;
    for(var d in sp)if(d>=from&&d<=to)h+=sp[d]/n;
  });
  return {h:Math.round(h*10)/10,missing:missing,undated:undated};
}

}

    '<span class="dv-card-top"><span class="dv-card-client">'+esc(it.client)+'</span><span class="dv-card-kind">'+(it.pri?'<span class="db-week-pri" title="High priority"><span class="sr-only">High priority</span><span aria-hidden="true">High</span></span>':'')+dvIc(it.kind==='project'?'project':'step')+esc(it.kind==='project'?'Project':it.stepKind)+'</span></span>'+

// A long motion list shows six and a Show more toggle. The toggle sits outside every card.

// Move control. Weekly cards pick a day of the week on screen, Status board cards pick a status. A status pick
// runs moveTo, the same call a drop makes, so any rule on a drop holds here too.
var dvBaseCard=dbHotWeekCard;
dbHotWeekCard=function(it,opt){
  var html=dvBaseCard.apply(this,arguments), w=(opt&&opt.where)||'', ctx=/^w\d{4}-\d{2}-\d{2}$/.test(w)&&!it.done?'day':w==='sb'?'status':'';
  if(!ctx)return html;
  return '<div class="dv-mv-wrap">'+html+'<button type="button" class="dv-mv-btn" data-dv-move="'+it.id+'" data-dv-ctx="'+ctx+'" data-k="mv-'+w+'-'+it.id+'" aria-haspopup="dialog" aria-label="Move '+esc(it.title)+(ctx==='day'?' to another day':' to another status')+'">'+dvIc('move')+'<span aria-hidden="true">Move</span></button></div>';
};
function dvEnsurePop(){
  if(dvPop)return dvPop;
  dvPop=document.createElement('dialog');
  dvPop.id='dvMovePop';dvPop.className='dv-pop';dvPop.setAttribute('aria-labelledby','dvMovePopH');
  document.body.appendChild(dvPop);
  dvPop.addEventListener('click',function(e){
    if(e.target===dvPop){var r=dvPop.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){dvPopClose(true);return;}}
    var t=e.target&&e.target.closest?e.target.closest('[data-dv-pick],[data-dv-pick-cancel]'):null;
    if(!t||t.disabled)return;
    if(t.hasAttribute('data-dv-pick-cancel'))dvPopClose(true);else dvPick(t.getAttribute('data-dv-pick'));
  });
  dvPop.addEventListener('cancel',function(e){e.preventDefault();dvPopClose(true);});
  return dvPop;
}
function dvShort(d){return DAYS[dow(d)].slice(0,3)+', '+fmtShort(d);}
function dvOpenMove(btn){
  var id=btn.getAttribute('data-dv-move'), ctx=btn.getAttribute('data-dv-ctx'), it=findItem(id);if(!it)return;
  dvEnsurePop();dvPopFor={id:id,ctx:ctx,key:btn.getAttribute('data-k')};
  var opts=ctx==='day'?[0,1,2,3,4].map(function(i){var d=addDays(state.weekStart,i);return {v:d,cur:d===it.due,html:'<span>'+dvShort(d)+'</span>'+(d===TODAY&&d!==it.due?'<span class="dv-pop-tag">Today</span>':'')};})
    :STATUSES.filter(function(st){return !(it.kind==='step'&&st[0]==='hold');}).map(function(st){return {v:st[0],cur:st[0]===it.status,html:chip(st[0])};});
  var sub=ctx==='day'?(it.due?'Due '+dvShort(it.due)+'. Pick a new day.':'No date yet. Pick a day.'):'Now '+statusName(it.status)+'. Pick a status.';
  dvPop.innerHTML='<p class="eyebrow">Move</p><h2 class="dv-pop-h" id="dvMovePopH">'+esc(it.title)+'</h2><p class="dv-pop-sub">'+esc(sub)+'</p>'+
    '<ul class="dv-pop-list">'+opts.map(function(o){return '<li><button type="button" class="dv-pop-opt" data-dv-pick="'+o.v+'" data-k="pick-'+o.v+'"'+(o.cur?' disabled aria-current="true"':'')+'>'+o.html+(o.cur?'<span class="dv-pop-tag">Current</span>':'')+'</button></li>';}).join('')+'</ul>'+
    '<div class="dv-pop-foot"><button type="button" class="btn-secondary" data-dv-pick-cancel data-k="pick-cancel">Cancel</button></div>';
  var sheet=!!(window.matchMedia&&window.matchMedia('(max-width: 600px)').matches);
  dvPop.classList.toggle('is-sheet',sheet);dvPop.style.left='';dvPop.style.top='';
  try{dvPop.showModal();}catch(err){dvPop.setAttribute('open','');}
  if(!sheet){
    var r=btn.getBoundingClientRect(), w=dvPop.offsetWidth, h=dvPop.offsetHeight, vw=window.innerWidth, vh=window.innerHeight;
    var left=Math.min(Math.max(8,r.right-w),vw-w-8), top=r.bottom+6;
    if(top+h>vh-8)top=r.top-h-6;
    if(top<8)top=Math.max(8,vh-h-8);
    dvPop.style.left=Math.round(left)+'px';dvPop.style.top=Math.round(top)+'px';
  }
  var f=dvPop.querySelector('[data-dv-pick]:not([disabled])')||dvPop.querySelector('[data-dv-pick-cancel]');if(f)f.focus();
}
function dvPopClose(refocus){
  var f=dvPopFor;dvPopFor=null;
  if(dvPop&&dvPop.open)dvPop.close();
  if(refocus&&f){var b=VIEW.querySelector('[data-k="'+f.key+'"]');if(b)b.focus();}
}
function dvPick(val){
  var f=dvPopFor;if(!f)return;
  dvPopClose(false);
  var ok=f.ctx==='status'?moveTo(f.id,val):dvSetDue(f.id,val);
  if(!ok){var b=VIEW.querySelector('[data-k="'+f.key+'"]');if(b)b.focus();}
}
// A day pick writes the due date, re-renders, and follows the card to its new column.
function dvSetDue(id,date){
  var it=findItem(id);if(!it||!date||it.due===date)return false;
  var rec=(it.kind==='project'?it.project:it.step);if(!rec.originalDue&&rec.due&&rec.due!==date)rec.originalDue=rec.due;rec.due=date;
  render();
  var el=VIEW.querySelector('[data-k="w'+date+'-'+id+'"]');if(el)el.focus();
  dvSay(it.title+' moved to '+fmtLong(date)+'.');
  return true;
}

// Dragging near the left or right edge of any board that scrolls sideways scrolls it, faster the deeper the pointer
// goes into the edge, and it keeps going while the pointer rests there. It stops at the end of the board or the drag.
function dvAutoScroll(e){
  var under=document.elementFromPoint(e.clientX,e.clientY), sc=under&&under.closest?under.closest('.db-week-scroll'):null, v=0, Z=56;
  if(!sc&&drag&&drag.src&&drag.src.closest)sc=drag.src.closest('.db-week-scroll');
  if(sc){
    var r=sc.getBoundingClientRect(), L=Math.max(r.left,0), R=Math.min(r.right,window.innerWidth);
    if(e.clientX>R-Z)v=Math.min(18,Math.ceil((e.clientX-(R-Z))/Z*18));
    else if(e.clientX<L+Z)v=-Math.min(18,Math.ceil((L+Z-e.clientX)/Z*18));
  }
  dvScrollEl=sc;dvScrollV=v;dvLastX=e.clientX;dvLastY=e.clientY;
  if(v&&!dvRaf)dvRaf=requestAnimationFrame(dvScrollTick);
}
function dvScrollTick(){
  dvRaf=0;
  if(!drag||!drag.live||!dvScrollEl||!dvScrollV){dvScrollV=0;return;}
  var before=dvScrollEl.scrollLeft;dvScrollEl.scrollLeft=before+dvScrollV;
  if(dvScrollEl.scrollLeft===before){dvScrollV=0;return;}
  // The column under a resting pointer changes as the board slides, so the drop highlight follows it.
  var u=document.elementFromPoint(dvLastX,dvLastY), col=u&&u.closest?u.closest('.db-stat-board .db-week-day'):null;
  if(col!==drag.over){if(drag.over)drag.over.classList.remove('is-over');drag.over=col;if(col)col.classList.add('is-over');}
  dvRaf=requestAnimationFrame(dvScrollTick);
}

document.addEventListener('click',function(e){
  if(e.defaultPrevented)return;
  var t=e.target&&e.target.closest?e.target.closest('[data-su-start],[data-dv-move],[data-dv-more]'):null;
  if(!t||!VIEW.contains(t))return;
  if(t.hasAttribute('data-su-start'))suStart();
  else if(t.hasAttribute('data-dv-more')){dvShowAll=dvShowAll===state.day?null:state.day;render();}
  else dvOpenMove(t);
});
// Capture phase, and only while a layer of ours is open, so the page's own keys never see these presses.
document.addEventListener('keydown',function(e){
  if(suLayer&&suLayer.open){
    if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();suEnd();}
    else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();e.stopImmediatePropagation();suStep(e.key==='ArrowRight'?1:-1);}
    return;
  }
  if(dvPop&&dvPop.open){
    if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();dvPopClose(true);return;}
    var k=e.key;if(k!=='ArrowDown'&&k!=='ArrowUp'&&k!=='Home'&&k!=='End')return;
    e.preventDefault();e.stopImmediatePropagation();
    var bs=all(dvPop,'button:not([disabled])'), i=bs.indexOf(document.activeElement);
    var j=k==='Home'?0:k==='End'?bs.length-1:i<0?0:(i+(k==='ArrowDown'?1:-1)+bs.length)%bs.length;
    if(bs[j])bs[j].focus();
  }
},true);

/* ---------- Executive (Wave 2, patch B; Review 1, track ex) ----------
   Five tabs. Home is the agency overview as of today, Working capacity is one week per person on the shared effort
   module, Quarterly and Yearly plan open work by due date, and Assignments is who is on what that week. A piece with
   no estimate or no date is counted and flagged, never read as zero. State lives on state.exTab, exWeek, exQuarter,
   exYear, exScope and exClient. */
var EX_TABS=[['home','Home'],['capacity','Working capacity'],['quarterly','Quarterly'],['yearly','Yearly'],['assignments','Assignments'],['standup','Standup']];
var EX_HOLIDAY_NAMES={'2026-11-26':'Thanksgiving','2026-11-27':'Day after Thanksgiving','2026-12-24':'Christmas Eve','2026-12-25':'Christmas','2027-01-01':"New Year's Day"};
function exQuarterOf(d){var m=+d.slice(5,7);return d.slice(0,4)+'-'+String(m-((m-1)%3)).padStart(2,'0');}
if(state.exTab==null)state.exTab='home';
if(state.exWeek==null)state.exWeek=mondayOf(TODAY);
if(state.exQuarter==null)state.exQuarter=exQuarterOf(TODAY);
if(state.exYear==null)state.exYear=+TODAY.slice(0,4);
function exRange(tab){
  tab=tab||state.exTab;
  if(tab==='quarterly'){var q=state.exQuarter;return {from:q+'-01',to:monthEnd(shiftMonth(q,2))};}
  if(tab==='yearly'){var y=state.exYear;return {from:y+'-01-01',to:y+'-12-31'};}
  return {from:state.exWeek,to:addDays(state.exWeek,6)};
}
function exRangeLabel(from,to){var y1=from.slice(0,4),y2=to.slice(0,4);return y1===y2?fmtShort(from)+' to '+fmtShort(to)+', '+y1:fmtShort(from)+', '+y1+' to '+fmtShort(to)+', '+y2;}
function exPeriodLabel(tab){
  tab=tab||state.exTab;var r=exRange(tab);
  if(tab==='quarterly')return 'Q'+Math.ceil(+state.exQuarter.slice(5,7)/3)+' '+state.exQuarter.slice(0,4)+', '+fmtShort(r.from)+' to '+fmtShort(r.to);
  if(tab==='yearly')return state.exYear+', '+fmtShort(r.from)+' to '+fmtShort(r.to);
  return exRangeLabel(r.from,r.to);
}
function exUnit(tab){tab=tab||state.exTab;return tab==='quarterly'?'quarter':tab==='yearly'?'year':'week';}
function exStep(n){var t=state.exTab;if(t==='quarterly')state.exQuarter=shiftMonth(state.exQuarter,3*n);else if(t==='yearly')state.exYear+=n;else state.exWeek=addDays(state.exWeek,7*n);}
function exNow(){var t=state.exTab;if(t==='quarterly')state.exQuarter=exQuarterOf(TODAY);else if(t==='yearly')state.exYear=+TODAY.slice(0,4);else state.exWeek=mondayOf(TODAY);}
function exIsNow(){var t=state.exTab;if(t==='quarterly')return state.exQuarter===exQuarterOf(TODAY);if(t==='yearly')return state.exYear===+TODAY.slice(0,4);return state.exWeek===mondayOf(TODAY);}
// Teams as {name, lead, people}. Creative and Media keep the roster exScopePeople names, trimmed to those people, so a
// department is never guessed from its name. Everyone lists every team plus anybody who owns open work but sits on no team.
function exGroups(){
  var teams=SEED.teams.map(function(t){return {name:t.name,lead:t.lead,people:(t.lead?[t.lead]:[]).concat(t.members||[])};}), ppl=exScopePeople(state.exScope);
  if(ppl){
    var inScope=teams.map(function(t){return {name:t.name,lead:t.lead,people:t.people.filter(function(p){return ppl.indexOf(p)>-1;})};}).filter(function(t){return t.people.length>0;});
    return {groups:inScope,fallback:false};
  }
  var known={}, extra={};
  teams.forEach(function(t){t.people.forEach(function(p){known[p]=1;});});
  workPieces().forEach(function(it){if(it.done)return;(it.owners||[]).forEach(function(o){if(!known[o])extra[o]=1;});});
  var ex=Object.keys(extra).sort();
  if(ex.length)teams.push({name:'Not on a team',lead:null,people:ex});
  return {groups:teams,fallback:false};
}
function exPeople(groups){var out=[];groups.forEach(function(g){g.people.forEach(function(p){if(out.indexOf(p)<0)out.push(p);});});return out;}
function exShowsUnassigned(){return state.exScope==='everyone';}
function exLoad(name,from,to){
  var a=availHours(name,from,to), s=scheduledHours(name,from,to), h=s.h;
  return {name:name,a:a,h:h,missing:s.missing,undated:s.undated,pct:a?Math.round(h/a*100):(h>0?999:0),over:h>a};
}
// Distinct open pieces owned by any of names that have no estimate in the range, or no date at all.
function exGaps(names,from,to){
  var miss=[], und=[];
  workPieces().forEach(function(it){
    if(it.done||it.hold||!(it.owners||[]).some(function(o){return names.indexOf(o)>-1;}))return;
    if(!it.due){und.push(it);return;}
    if(EST[it.id]==null&&it.due>=from&&(it.start||it.due)<=to)miss.push(it);
  });
  return {missing:miss,undated:und};
}
function exInRange(it,from,to){var sp=spread(it),h=0;for(var d in sp)if(d>=from&&d<=to)h+=sp[d];return h;}
// Open work nobody owns that touches the range, or has no date: {it, h, kind}.
function exUnassigned(from,to){
  var out=[];
  workPieces().forEach(function(it){
    if(it.done||(it.owners&&it.owners.length))return;
    if(!it.due){out.push({it:it,kind:'undated'});return;}
    if(it.due<from||(it.start||it.due)>to)return;
    if(it.hold){out.push({it:it,kind:'hold'});return;}
    if(EST[it.id]==null){out.push({it:it,kind:'unk'});return;}
    out.push({it:it,kind:'h',h:Math.round(exInRange(it,from,to)*10)/10});
  });
  return out;
}
// One person's open pieces that touch the range, with their share of the hours in it.
function exPersonPieces(name,from,to){
  var out=[], order={h:0,unk:1,hold:2,undated:3};
  workPieces().forEach(function(it){
    if(it.done||(it.owners||[]).indexOf(name)<0)return;
    if(!it.due){out.push({it:it,kind:'undated'});return;}
    if(it.due<from||(it.start||it.due)>to)return;
    if(it.hold){out.push({it:it,kind:'hold'});return;}
    if(EST[it.id]==null){out.push({it:it,kind:'unk'});return;}
    out.push({it:it,kind:'h',h:Math.round(exInRange(it,from,to)/it.owners.length*10)/10});
  });
  return out.sort(function(a,b){return order[a.kind]-order[b.kind]||String(a.it.due||'').localeCompare(String(b.it.due||''))||a.it.title.localeCompare(b.it.title);});
}
function exH(h){return (Math.round(h*10)/10)+'h';}
function exNum(n){return Number(n).toLocaleString('en-US');}
function exSlug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'');}
function exPct(h,a){return a?Math.round(h/a*100):0;}
function exChip(cls,txt){return '<span class="ex-chip '+cls+'">'+txt+'</span>';}
function exStat(cls,name,fig,figCls,sub,attr){
  return '<div class="ex-stat'+(cls?' '+cls:'')+'"'+(attr||'')+'><span class="ex-stat-name">'+name+'</span><span class="ex-stat-row"><span class="fig'+(figCls?' '+figCls:'')+'">'+fig+'</span><span class="ex-stat-sub">'+sub+'</span></span></div>';
}

/* Working capacity: one week, one bar per person. The track is the person's available hours on a shared scale
   with a tick per working day; the fill is scheduled hours, red past the end of the track, and a dashed stub
   follows the fill when some of the work has no estimate. */
function exCapacity(groups){
  var r=exRange('capacity'), from=r.from, to=r.to, rows={}, list=[], people=exPeople(groups);
  people.forEach(function(p){rows[p]=exLoad(p,from,to);list.push(rows[p]);});
  var tA=0, tH=0;list.forEach(function(x){tA+=x.a;tH+=x.h;});
  var over=list.filter(function(x){return x.over;}).sort(function(a,b){return (b.h-b.a)-(a.h-a.a);});
  var top=list.filter(function(x){return x.a>0&&x.h>0;}).sort(function(a,b){return b.pct-a.pct||a.name.localeCompare(b.name);})[0]||null;
  var gaps=exGaps(people,from,to), nMiss=gaps.missing.length, nUnd=gaps.undated.length, gapParts=[];
  if(nMiss)gapParts.push(nMiss+' no estimate');if(nUnd)gapParts.push(nUnd+' no date');
  var maxH=8;list.forEach(function(x){maxH=Math.max(maxH,x.a,x.h);});maxH=Math.ceil(maxH/8)*8;
  var wd=workdays(from,to);
  var stats='<div class="ex-stats">'+
    exStat('','Booked',exH(tH),tH?'':'is-zero','of '+exNum(tA)+'h available')+
    exStat(over.length?'is-over':'','Over capacity',String(over.length),over.length?'is-late':'is-zero',over.length?esc(over.map(function(x){return x.name;}).join(', ')):'Nobody over',' data-ex-stat="over"')+
    exStat('','Most booked',top?top.pct+'%':'None',top?'':'is-zero',top?esc(top.name)+', '+exH(top.h)+' of '+top.a+'h':'Nothing booked')+
    exStat(nMiss+nUnd?'is-warn':'','No estimate',String(nMiss+nUnd),nMiss+nUnd?'':'is-zero',gapParts.length?gapParts.join(', '):'All estimated and dated',' data-ex-stat="gaps"')+
  '</div>';
  function row(x,lead){
    var me=x.name, offs=wd.filter(function(d){return isOff(me,d);}), notes=[];
    if(lead===me)notes.push('Lead');
    if(wd.length&&x.a===0)notes.push('Off all week');
    else if(offs.length)notes.push('Off '+offs.map(function(d){return DAYS[dow(d)].slice(0,3)+' '+fmtShort(d);}).join(', '));
    if(DAY_HOURS[me]!=null)notes.push(dayHours(me)+' hour days');
    var inc=x.missing>0, isTop=!over.length&&top===x, cls=(x.over?' is-over':'')+(isTop?' is-top':'')+(inc?' is-incomplete':'');
    var trackW=x.a/maxH*100, fillW=x.a?Math.min(x.h,x.a)/x.a*100:0, overW=x.over?(x.h-x.a)/maxH*100:0, unkL=x.h/maxH*100;
    var hours=inc?(x.h>0?exH(x.h)+'+':'Not estimated'):exH(x.h);
    var pct=x.a===0?(x.h>0?'Over':'Off'):inc?(x.h>0?x.pct+'%+':'?'):x.pct+'%';
    var aria=me+', '+exH(x.h)+' booked of '+x.a+'h available'+(x.a?', '+x.pct+' percent':'')+(x.over?', over by '+exH(x.h-x.a):'')+(inc?', plus '+plural(x.missing,'task','tasks')+' with no estimate':'');
    var chips=[];
    if(x.missing)chips.push(exChip('is-unk',plural(x.missing,'task has','tasks have')+' no estimate'));
    if(x.undated)chips.push(exChip('is-undated',plural(x.undated,'task has','tasks have')+' no date'));
    if(x.over)chips.push(exChip('is-over','Over by '+exH(x.h-x.a)));
    if(isTop)chips.push(exChip('is-top','Most booked'));
    return '<li class="ex-row'+cls+'" data-ex-person="'+esc(me)+'" data-ex-avail="'+x.a+'" data-ex-sched="'+x.h+'" data-ex-missing="'+x.missing+'">'+
      '<div class="ex-who"><button type="button" class="ex-name" data-ex-who="'+esc(me)+'" data-k="ex-p-'+esc(me)+'" title="Open '+esc(me)+'&apos;s week in the Workspace"><span class="av-i" aria-hidden="true">'+esc(initials(me))+'</span><span>'+esc(me)+'</span></button>'+
      (notes.length?'<span class="ex-note">'+esc(notes.join(', '))+'</span>':'')+'</div>'+
      '<div class="ex-meter" role="img" aria-label="'+esc(aria)+'">'+
        (x.a?'<span class="ex-track" style="width:'+trackW.toFixed(2)+'%;--ex-step:'+(dayHours(me)/x.a*100).toFixed(3)+'%"><span class="ex-fill" style="width:'+fillW.toFixed(2)+'%"></span></span>':'')+
        (overW?'<span class="ex-overseg" style="left:'+trackW.toFixed(2)+'%;width:'+overW.toFixed(2)+'%"></span>':'')+

/* ---------- Brief required (agent D) ----------
   A Full track project with no brief can sit in the queue or Intake and go on hold, nothing later. applyStatus and
   moveTo refuse it at the top, so a drag, [ or ], tap to move and every select hit the same rule and the same words.
   QC stays advisory: nothing here or anywhere reads p.qc before a status change. */
var stQuiet=false, stToastT=null;
var ST_PAST_INTAKE=['progress','review','qc','client','done'];
function stBriefBlock(it,k){
  var p=it&&it.project;
  if(!it||it.kind!=='project'||!p||p.track!=='Full'||p.brief)return null;
  if(ST_PAST_INTAKE.indexOf(k)<0)return null;
  return it.title+' is Full track with no brief. Link a brief before it moves past Intake.';
}
function stOpt(it,s,own){
  var b=s[0]!==own&&stBriefBlock(it,s[0]);
  return '<option value="'+s[0]+'"'+(s[0]===own?' selected':'')+(b?' disabled':'')+'>'+s[1]+(b?' (needs a brief)':'')+'</option>';
}
function stToast(msg){
  var t=document.getElementById('stToast');
  if(!t){t=document.createElement('div');t.id='stToast';t.className='st-toast';t.setAttribute('aria-hidden','true');document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('is-on');
  clearTimeout(stToastT);stToastT=setTimeout(function(){t.classList.remove('is-on');},4500);
}
function stRefuse(msg){
  if(stQuiet)return;
  var live=DLG&&DLG.open&&document.getElementById('dlgLive');
  if(live){live.textContent=msg;return;}
  announce(msg);stToast(msg);
}
// Runs before the dialog's own change handler, so a blocked pick snaps back with the brief reason, not a generic one.
document.addEventListener('change',function(e){

  var id=el.getAttribute('data-dlg-status'), it=findItem(id), b=it&&stBriefBlock(it,el.value);
  if(!b)return;
  e.stopImmediatePropagation();
  el.value=it.kind==='step'?it.own:it.status;
  if(DLG&&DLG.open&&DLG.contains(el))refreshDlg(id,b);else{announce(b);stToast(b);}
},true);

function exSuSample(){

  var C={hi:'#ff4d4f',md:'#ff9f1a',op:'#4da3ff',ok:'#2fd67b'}, L={hi:'Major',md:'Minor',op:'Opportunity',ok:'Keep'};
  var on=true, panel=true, open=null, root=document.createElement('div');

  document.head.appendChild(css);

  function view(){
    var dl=document.querySelector('dialog[open]');
    if(dl&&dl.id==='taskDlg')return 'dlg';

    var h=location.hash;
    if(/^#weekly\/status/.test(h))return 'status';
    if(/^#weekly\/cal/.test(h))return 'cal';
    if(/^#weekly\/day/.test(h))return 'day';
    if(/^#weekly/.test(h))return 'week';
    if(/^#home/.test(h)||h==='')return 'home';
    return 'other';
  }
  function applies(a,v){if(v==='dlg'||v==='su')return a.w===v;return a.w==='any'||a.w===v||(a.w==='ws'&&/^(week|day|cal|status)$/.test(v));}
  function vis(e){var r=e.getBoundingClientRect();return r.width>=20&&r.height>=8&&r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth&&getComputedStyle(e).visibility!=='hidden';}
  function el(a){
    if(typeof a.q==='function'){var x=a.q();return x&&vis(x)?x:null;}
    var all=[].slice.call(document.querySelectorAll(a.q)).filter(vis);
    all.sort(function(m,n){var r=m.getBoundingClientRect(),q=n.getBoundingClientRect();return (r.top-q.top)||(r.left-q.left);});
    return all.filter(function(e){return e.getBoundingClientRect().width>60;})[0]||all[0]||null;
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function draw(){
    var host=document.querySelector('dialog[open]')||document.body;
    if(root.parentNode!==host)host.appendChild(root);
    var v=view(), html='', list=[];
    if(on){
      A.forEach(function(a){
        if(!applies(a,v))return;
        var e=el(a); if(!e)return;
        var r=e.getBoundingClientRect(); if(!r.width&&!r.height)return;
        list.push(a);
        var c=C[a.s];
        html+='<div class="mk-box" style="left:'+(r.left-3)+'px;top:'+(r.top-3)+'px;width:'+(r.width+2)+'px;height:'+(r.height+2)+'px;border-color:'+c+'"></div>';
        var px=Math.max(4,Math.min(innerWidth-28,r.left-12)), py=Math.max(4,r.top-12);
        html+='<div class="mk-pin" data-mk="'+a.n+'" style="left:'+px+'px;top:'+py+'px;background:'+c+'" title="'+esc(a.t)+'">'+a.n+'</div>';
        if(open===a.n){
          var nx=Math.min(innerWidth-312,px+30), ny=Math.min(innerHeight-200,py);
          html+='<div class="mk-note" style="left:'+nx+'px;top:'+Math.max(4,ny)+'px;border-color:'+c+'"><span class="mk-tag" style="color:'+(a.s==='lo'?'#8a7a00':c)+'">#'+a.n+' · '+L[a.s]+'</span><h4>'+esc(a.t)+'</h4><p>'+esc(a.x)+'</p><p class="mk-fix"><b>'+(a.s==='ok'?'Action':'Fix')+':</b> '+esc(a.f)+'</p></div>';
        }
      });
      if(panel)html+='<div class="mk-panel"><h3>Findings on this view ('+list.length+')</h3><ul>'+list.map(function(a){return '<li data-mk="'+a.n+'"><span class="mk-dot" style="background:'+C[a.s]+'">'+a.n+'</span>'+esc(a.t)+'</li>';}).join('')+'</ul></div>';
    }
    if(panel)html+='<button class="mk-toggle" data-mk-toggle>'+(on?'Hide markup (M)':'Show markup (M)')+'</button>';
    if(root.innerHTML!==html)root.innerHTML=html;
  }
  root.addEventListener('click',function(ev){
    var t=ev.target.closest('[data-mk],[data-mk-toggle]'); if(!t)return;
    ev.stopPropagation(); ev.preventDefault();
    if(t.hasAttribute('data-mk-toggle')){on=!on;open=null;}
    else{var n=+t.getAttribute('data-mk');open=open===n?null:n;}

  },true);
  document.addEventListener('keydown',function(ev){
    if(ev.key&&ev.key.toLowerCase()==='m'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){on=!on;open=null;draw();}
  });
  window.__markup={print:function(){open=null;panel=false;draw();return [].slice.call(root.querySelectorAll('.mk-pin')).map(function(e){return +e.dataset.mk;});},show:function(n){on=true;open=n;draw();},hideNotes:function(){open=null;draw();},list:A};
  setInterval(draw,250);
