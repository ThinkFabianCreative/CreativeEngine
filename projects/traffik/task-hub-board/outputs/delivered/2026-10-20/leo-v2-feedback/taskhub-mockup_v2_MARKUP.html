<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Hub mockup · audit markup</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Manrope:wght@400..800&family=Urbanist:wght@500;600&display=swap">
<style>
/* Tokens. The first block is the live :root, copied as given. The sidebar and menu values below it are the
   ones the live header already uses (white at 60, 50, 22, 14, 10, 7 and 6 percent), named so nothing outside
   :root and the dark block carries a raw color. The sidebar's #202020 is live's header color, the one literal.
   The canvas is grey (--bg-app) and every surface on it is white (--bg-canvas), the Trello shape. */
:root{
--brand-red:#C8102E; --brand-red-dark:#A8122A;
--font-display:'Urbanist',system-ui,sans-serif; --font-sans:'Manrope',system-ui,sans-serif; --font-mono:'Geist Mono',ui-monospace,monospace; --font-label:var(--font-sans); --fw-label:800;
--track-label:0.05em; --track-label-wide:0.08em; --track-display:-0.022em;
--bg-canvas:#FFFFFF; --bg-subtle:#FAFAFA; --bg-hover:#F4F4F5;
--border-hairline:rgba(17,17,17,0.09); --border-strong:rgba(17,17,17,0.16);
--text-primary:#14151A; --text-secondary:#313131; --text-tertiary:#6B6B6B; --text-placeholder:#6E6E6E;
--status-danger:#BE123C; --status-danger-bg:#FEF1F1; --status-warn:#B45309; --status-warn-bg:#FFF7E0; --status-warn-ink:#855E0B; --status-ok:#1E7A4D;
--r-square:0; --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-circle:9999px;
--sp-1:2px; --sp-2:4px; --sp-3:6px; --sp-4:8px; --sp-5:12px; --sp-6:16px; --sp-7:20px; --sp-8:24px; --sp-9:32px; --sp-10:48px;
--fs-2xs:10px; --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px; --fs-lg:18px;
--fs-display-md:clamp(20px,0.6vw + 16px,24px); --fs-display-lg:clamp(34px,1.6vw + 22px,42px);
--motion-fast:80ms; --motion-standard:170ms;
--hot-ink:#242428; --hot-rule:var(--border-hairline); --hot-bleed:10px;

--hdr-ink:#FFFFFF; --hdr-ink-60:rgba(255,255,255,0.60); --hdr-ink-50:rgba(255,255,255,0.50);
--hdr-edge:rgba(255,255,255,0.22); --hdr-div:rgba(255,255,255,0.14); --hdr-hover:rgba(255,255,255,0.10);
--hdr-line:rgba(255,255,255,0.07); --hdr-fill:rgba(255,255,255,0.06);
--shadow-menu:0 18px 44px -14px rgba(10,10,12,0.30),0 2px 8px rgba(10,10,12,0.10);
--cta-bg:var(--brand-red);
--side-bg:#202020; --side-ink:rgba(255,255,255,0.72); --side-active-bg:#FFFFFF; --side-active-ink:#14151A;
--bg-app:#F5F6F8; --board-col:color-mix(in srgb,var(--text-primary) 8%,var(--bg-canvas));
--today-tint:color-mix(in srgb,var(--brand-red) 5%,var(--bg-canvas));
--client-ink-pct:70%;
--scrim:rgba(10,10,12,0.40);
/* Status chips. One flat tint per family: grey for the queue, blue for in progress, purple for review and QC,
   yellow for the client, tan for hold and green for complete. Each ink clears 4.5:1 on its tint. */
--st-queue-bg:#F1F2F4; --st-queue-ink:#44546F;
--st-intake-bg:#E9ECF1; --st-intake-ink:#3F4F68;
--st-progress-bg:#E1EAFB; --st-progress-ink:#1D4ED8;
--st-review-bg:#ECE6F9; --st-review-ink:#6D28D9;
--st-qc-bg:#F1E6F7; --st-qc-ink:#7E22CE;
--st-client-bg:#FDF3C4; --st-client-ink:#6F5200;
--st-hold-bg:#F2E8DC; --st-hold-ink:#6B4A1C;
--st-done-bg:#DDF4E6; --st-done-ink:#166A42;
--card-shadow:0 1px 2px rgba(10,10,12,0.06),0 0 0 1px rgba(17,17,17,0.05);
--card-shadow-lift:0 6px 18px -6px rgba(10,10,12,0.28),0 0 0 1px rgba(17,17,17,0.07);
--bar-tint:18%;
/* Client outline on cards: a thin edge in the client's color, a faint fill of it, the full color on hover. */
--card-edge:55%; --card-tint:6%;
}
:root[data-theme="dark"]{
color-scheme:dark;
--brand-red:#E86D81; --brand-red-dark:#C8445A;
--bg-canvas:oklch(20% 0.008 270); --bg-subtle:oklch(23.5% 0.008 270); --bg-hover:oklch(27% 0.009 270);
--border-hairline:rgba(255,255,255,0.13); --border-strong:rgba(255,255,255,0.18);
--text-primary:#F2F2F5; --text-secondary:rgba(255,255,255,0.70); --text-tertiary:rgba(255,255,255,0.52); --text-placeholder:rgba(255,255,255,0.50);
--status-danger:#FF4D4D; --status-danger-bg:#371519; --status-warn:#E0A33E; --status-warn-bg:#2E2412; --status-warn-ink:#E0A33E; --status-ok:#5FC98C;
--hot-ink:#E8E8EC;
--cta-bg:var(--brand-red-dark);
--side-bg:oklch(15.5% 0.008 270); --side-ink:rgba(255,255,255,0.72); --side-active-bg:rgba(255,255,255,0.12); --side-active-ink:#FFFFFF;
--bg-app:oklch(17% 0.008 270); --board-col:color-mix(in srgb,var(--text-primary) 3%,var(--bg-app));
--today-tint:color-mix(in srgb,var(--brand-red) 5%,var(--bg-canvas));
--client-ink-pct:0%;
--scrim:rgba(10,10,12,0.62);
--st-queue-bg:#2A2F3A; --st-queue-ink:#B9C3D3;
--st-intake-bg:#2A303B; --st-intake-ink:#B9C3D3;
--st-progress-bg:#1F2A45; --st-progress-ink:#9DBBFF;
--st-review-bg:#2C2440; --st-review-ink:#C9B5F5;
--st-qc-bg:#302441; --st-qc-ink:#D5B8F2;
--st-client-bg:#3A3215; --st-client-ink:#F2D575;
--st-hold-bg:#332B20; --st-hold-ink:#E0C09A;
--st-done-bg:#1B3327; --st-done-ink:#86D9A8;
--card-shadow:0 1px 2px rgba(0,0,0,0.40),0 0 0 1px rgba(255,255,255,0.08);
--card-shadow-lift:0 8px 22px -6px rgba(0,0,0,0.60),0 0 0 1px rgba(255,255,255,0.12);
--bar-tint:26%;
--card-edge:62%; --card-tint:11%;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme]){
color-scheme:dark;
--brand-red:#E86D81; --brand-red-dark:#C8445A;
--bg-canvas:oklch(20% 0.008 270); --bg-subtle:oklch(23.5% 0.008 270); --bg-hover:oklch(27% 0.009 270);
--border-hairline:rgba(255,255,255,0.13); --border-strong:rgba(255,255,255,0.18);
--text-primary:#F2F2F5; --text-secondary:rgba(255,255,255,0.70); --text-tertiary:rgba(255,255,255,0.52); --text-placeholder:rgba(255,255,255,0.50);
--status-danger:#FF4D4D; --status-danger-bg:#371519; --status-warn:#E0A33E; --status-warn-bg:#2E2412; --status-warn-ink:#E0A33E; --status-ok:#5FC98C;
--hot-ink:#E8E8EC;
--cta-bg:var(--brand-red-dark);
--side-bg:oklch(15.5% 0.008 270); --side-ink:rgba(255,255,255,0.72); --side-active-bg:rgba(255,255,255,0.12); --side-active-ink:#FFFFFF;
--bg-app:oklch(17% 0.008 270); --board-col:color-mix(in srgb,var(--text-primary) 3%,var(--bg-app));
--today-tint:color-mix(in srgb,var(--brand-red) 5%,var(--bg-canvas));
--client-ink-pct:0%;
--scrim:rgba(10,10,12,0.62);
--st-queue-bg:#2A2F3A; --st-queue-ink:#B9C3D3;
--st-intake-bg:#2A303B; --st-intake-ink:#B9C3D3;
--st-progress-bg:#1F2A45; --st-progress-ink:#9DBBFF;
--st-review-bg:#2C2440; --st-review-ink:#C9B5F5;
--st-qc-bg:#302441; --st-qc-ink:#D5B8F2;
--st-client-bg:#3A3215; --st-client-ink:#F2D575;
--st-hold-bg:#332B20; --st-hold-ink:#E0C09A;
--st-done-bg:#1B3327; --st-done-ink:#86D9A8;
--card-shadow:0 1px 2px rgba(0,0,0,0.40),0 0 0 1px rgba(255,255,255,0.08);
--card-shadow-lift:0 8px 22px -6px rgba(0,0,0,0.60),0 0 0 1px rgba(255,255,255,0.12);
--bar-tint:26%;
--card-edge:62%; --card-tint:11%;
}
}

/* Base */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg-app)}
body{margin:0;background:var(--bg-app);color:var(--text-primary);font:400 13px/1.45 var(--font-sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--text-primary);outline-offset:2px}
:focus:not(:focus-visible){outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;padding:8px 12px;border-radius:var(--r-xs);background:var(--bg-canvas);color:var(--text-primary);font-weight:600;text-decoration:none}
.skip:focus{top:12px}

/* Sidebar. Fixed to the left edge in the live header's dark, 228px open and 72px compact. The TRAFFIK lockup,
   the nav labels and the footer text fade and collapse in compact, and a tooltip from data-label stands in for
   the labels. Under 1024px it is always compact; under 768px it becomes a sticky top strip. */
:root{--side:228px}
body.side-compact{--side:72px}
.side{position:fixed;left:0;top:0;bottom:0;z-index:50;display:flex;flex-direction:column;width:var(--side);padding:16px 12px 14px;background:var(--side-bg);border-right:1px solid var(--hdr-line);color:var(--hdr-ink);transition:width var(--motion-standard) ease}
.side :focus-visible{outline-color:var(--hdr-ink)}
.side-brand{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 8px;border:0;border-radius:10px;background:transparent;color:var(--hdr-ink);text-align:left;overflow:hidden;transition:gap var(--motion-standard) ease}
.side-brand:hover{background:var(--hdr-hover)}
.logo-mark{flex:none;display:block;width:28px;height:28px}
.logo-mark svg{display:block;width:28px;height:28px}
.side-brand-text{display:flex;flex-direction:column;gap:5px;flex:0 0 auto;width:96px;min-width:0;overflow:hidden;opacity:1;transform:none;transition:opacity var(--motion-standard) ease,transform var(--motion-standard) ease,width var(--motion-standard) ease}
.hdr-wordmark{display:block;width:96px;height:16px}
.side-caption{font:700 9px/1 var(--font-sans);letter-spacing:0.14em;text-transform:uppercase;color:var(--hdr-ink-50);white-space:nowrap}
.side-section{margin:22px 0 6px;padding:0 12px;font:var(--fw-label) 10px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--hdr-ink-50);white-space:nowrap;overflow:hidden}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:0 1 auto;min-height:0;overflow:visible}
.side-btn{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--side-ink);font:550 13px/1 var(--font-sans);text-align:left;white-space:nowrap;overflow:visible;transition:background var(--motion-fast) ease,color var(--motion-fast) ease,width var(--motion-standard) ease,gap var(--motion-standard) ease}
.side-btn svg{flex:none;width:18px;height:18px}
.side-btn:hover{background:var(--hdr-hover);color:var(--hdr-ink)}
.side-btn[aria-current="page"]{background:var(--side-active-bg);color:var(--side-active-ink)}
.side-btn[aria-current="page"] svg{color:var(--brand-red)}
.side-label{display:block;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;transition:opacity var(--motion-standard) ease}
.side-btn::after,.side-cta::after{content:attr(data-label);position:absolute;left:calc(100% + 14px);top:50%;z-index:70;display:none;padding:6px 10px;border-radius:8px;background:var(--text-primary);color:var(--bg-canvas);font:600 12px/1.2 var(--font-sans);white-space:nowrap;transform:translateY(-50%);box-shadow:var(--shadow-menu);pointer-events:none}
.side-foot{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:12px;border-top:1px solid var(--hdr-div)}
.side-viewas{display:flex;flex-direction:column;gap:4px;margin:0 0 4px;padding:8px 10px;border:1px solid var(--hdr-edge);border-radius:10px;background:var(--hdr-fill)}
.side-viewas-cap{font:700 10px/1 var(--font-sans);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--hdr-ink-50);white-space:nowrap}
.side-viewas select{width:100%;max-width:100%;padding:2px 0;border:0;background:transparent;color:var(--hdr-ink);font:600 12px var(--font-sans);color-scheme:dark}
.hdr-more{position:relative}
.side-user{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 6px;border:0;border-radius:10px;background:transparent;color:var(--hdr-ink);text-align:left;overflow:hidden;transition:gap var(--motion-standard) ease}
.side-user:hover,.side-user[aria-expanded="true"]{background:var(--hdr-hover)}
.side-av{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-circle);background:var(--cta-bg);color:var(--hdr-ink);font:700 11px/1 var(--font-sans);letter-spacing:0.02em}
.side-user-text{display:flex;flex-direction:column;gap:2px;flex:0 1 auto;min-width:0;overflow:hidden;transition:opacity var(--motion-standard) ease}
.side-user-name{font:600 13px/1.2 var(--font-sans);color:var(--hdr-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user-group{font:500 11px/1.2 var(--font-sans);color:var(--hdr-ink-60);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-menu{position:absolute;left:0;right:auto;bottom:calc(100% + 8px);top:auto;z-index:60;display:flex;flex-direction:column;min-width:198px;padding:6px;border:1px solid var(--border-hairline);border-radius:12px;background:var(--bg-canvas);box-shadow:var(--shadow-menu);color:var(--text-primary)}
.hdr-menu[hidden]{display:none}
.side .hdr-menu :focus-visible{outline-color:var(--text-primary);outline-offset:-2px}
.hdrm-it{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--text-primary);font:500 13px var(--font-sans);text-align:left;white-space:nowrap}
.hdrm-it:hover{background:var(--bg-hover)}
.hdrm-meta{font-size:11px;color:var(--text-secondary)}
.hdrm-sep{height:1px;margin:6px 4px;background:var(--border-hairline)}
/* Viewing as moves into the menu while the sidebar is compact or a top strip, so a user can still switch. */
.hdrm-viewas-wrap{display:none}
.hdrm-viewas{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:8px;background:var(--bg-subtle)}
.hdrm-viewas-cap{font:700 10px/1 var(--font-sans);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-secondary);white-space:nowrap}
.hdrm-viewas select{width:100%;max-width:100%;padding:2px 0;border:0;background:transparent;color:var(--text-primary);font:600 13px var(--font-sans)}
body.side-compact .hdrm-viewas-wrap{display:block}
.side-collapse{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--hdr-ink-60);font:550 12px/1 var(--font-sans);text-align:left;white-space:nowrap;overflow:hidden;transition:gap var(--motion-standard) ease}
.side-collapse:hover{background:var(--hdr-hover);color:var(--hdr-ink)}
.side-collapse svg{flex:none;width:16px;height:16px;transition:transform var(--motion-standard) ease}
.btn-cta-red{display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border:0;border-radius:8px;background:var(--cta-bg);color:var(--hdr-ink);font:700 13px var(--font-sans);white-space:nowrap}
.btn-cta-red:hover{background:var(--hdr-ink);color:var(--cta-bg);box-shadow:inset 0 0 0 1px var(--cta-bg)}
.side-cta{position:relative;display:flex;justify-content:center;gap:8px;width:100%;min-height:40px;margin:14px 0 0;padding:0 12px;border-radius:10px;overflow:visible;transition:width var(--motion-standard) ease,gap var(--motion-standard) ease}
.side-plus{font:700 18px/1 var(--font-sans)}
/* Compact: 44px squares, labels folded away, tooltips on hover and focus. */
body.side-compact .side{padding-left:14px;padding-right:14px}
body.side-compact .side-brand{width:44px;padding:0 8px;gap:0}
body.side-compact .side-brand-text{width:0;opacity:0;transform:translateX(-6px)}
body.side-compact .side-cta{width:44px;padding:0;gap:0}
body.side-compact .side-btn{width:44px;padding:0 13px;gap:0}
body.side-compact .side-label{flex:0 0 0;width:0;opacity:0}
body.side-compact .side-btn:hover::after,body.side-compact .side-btn:focus-visible::after,body.side-compact .side-cta:hover::after,body.side-compact .side-cta:focus-visible::after{display:block}
body.side-compact .side-section,body.side-compact .side-viewas{display:none}
body.side-compact .side-user{width:44px;padding:0 6px;gap:0}
body.side-compact .side-user-text{width:0;opacity:0}
body.side-compact .side-collapse{width:44px;padding:0 14px;gap:0}
body.side-compact .side-collapse svg{transform:rotate(180deg)}

/* Shell */
main{display:block;max-width:1320px;margin:0 0 0 var(--side);padding:28px 32px 64px;transition:margin-left var(--motion-standard) ease}
main:focus{outline:none}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
.is-entering{animation:viewIn var(--motion-standard) ease both}
.masthead{width:fit-content;margin:0;font:500 var(--fs-display-lg)/1.06 var(--font-display);letter-spacing:-0.04em;color:var(--text-primary)}
.eyebrow{margin:0;font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.folio{display:flex;flex-wrap:wrap;gap:4px 8px;margin:14px 0 28px;padding-bottom:10px;border-bottom:1px solid var(--border-hairline);font:var(--fw-label) 11px/1.4 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.dr-link{padding:0;border:0;border-bottom:1px solid var(--border-strong);background:none;font:var(--fw-label) 11px var(--font-label);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-secondary)}
.dr-link:hover{color:var(--text-primary);border-bottom-color:var(--text-primary)}
.db-link{padding:0;border:0;background:none;font:600 12px var(--font-sans);color:var(--text-primary);text-decoration:underline;text-underline-offset:3px}
.ph-panel{margin-top:22px;padding:18px 20px;border:0;border-radius:15px;background:var(--bg-canvas);box-shadow:var(--card-shadow);font-size:13px;color:var(--text-secondary)}
.ph-panel p{margin:0}
.ph-panel p+p{margin-top:6px}

/* Hot Sheet: heading, pills, toolbar */
.db-hot-shell{--hot-bleed:10px;padding-top:2px}
.db-hot-heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:0 0 22px}
.db-hot-views{display:flex;gap:3px;padding:4px;border:0;border-radius:12px;background:var(--bg-canvas);box-shadow:var(--card-shadow)}
.db-hot-views button{min-height:39px;padding:0 16px;border:0;border-radius:8px;background:transparent;color:var(--text-secondary);font:550 12px/1.4 var(--font-sans);white-space:nowrap}
.db-hot-views button.on{background:var(--hot-ink);color:var(--bg-canvas)}
/* The toolbar sticks under the header so the filters stay put while the board scrolls. The ::before strip masks
   the canvas around its rounded corners. */
.db-hot-toolbar{position:sticky;top:12px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:12px;padding:18px 20px;border:0;border-radius:15px;background:var(--bg-canvas);box-shadow:var(--card-shadow)}
.db-hot-toolbar::before{content:'';position:absolute;left:-6px;right:-6px;top:-14px;bottom:-1px;z-index:-1;background:var(--bg-app)}
.db-hot-date{display:flex;align-items:center;gap:10px}
.db-hot-step{height:34px;min-width:30px;padding:0 8px;border:1px solid var(--border-hairline);border-radius:7px;background:var(--bg-canvas);color:var(--text-primary);font-size:19px;line-height:1}
.db-hot-period{font:600 13px var(--font-sans);white-space:nowrap}
.db-hot-date input[type=date]{height:34px;max-width:165px;padding:0;border:0;background:transparent;color:var(--text-primary);font:600 13px var(--font-sans)}
.db-hot-now{padding:0;border:0;background:none;color:var(--text-secondary);font-size:11px;text-decoration:underline;text-underline-offset:4px;white-space:nowrap}
.db-hot-filters{display:flex;align-items:center;gap:14px;flex-shrink:0}
.db-hot-filters label{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-secondary)}
.db-hot-filters select{height:34px;min-height:34px;min-width:102px;max-width:145px;padding:0 23px 0 10px;border:1px solid var(--border-hairline);border-radius:7px;background:var(--bg-canvas);color:var(--text-primary);font:500 11px var(--font-sans)}
.db-hot-filters label:last-of-type select{min-width:135px;max-width:155px}
.db-hot-clear{flex-shrink:0;min-height:34px;white-space:nowrap}
.db-hot-person{position:relative;display:flex;align-items:center;gap:7px;min-width:0;font-size:11px;color:var(--text-secondary)}
.db-hot-people{position:relative;min-width:0}
.db-hot-people>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;height:34px;min-width:135px;max-width:180px;padding:0 11px 0 10px;border:1px solid var(--border-hairline);border-radius:7px;background:var(--bg-canvas);color:var(--text-primary);font:500 11px var(--font-sans);white-space:nowrap;cursor:pointer}
.db-hot-people>summary::-webkit-details-marker{display:none}
.db-hot-people>summary::after{content:'';flex-shrink:0;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.75}
.db-hot-people[open]>summary::after{transform:translateY(1px) rotate(-135deg)}
.db-hot-people-value{overflow:hidden;text-overflow:ellipsis}
.db-hot-people-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:40;display:flex;flex-direction:column;width:260px;max-height:min(440px,70vh);border:1px solid var(--border-hairline);border-radius:10px;background:var(--bg-canvas);box-shadow:var(--shadow-menu);color:var(--text-primary)}
.db-hot-people-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px}
.db-hot-people fieldset{min-width:0;margin:0;padding:0;border:0}
.db-hot-people-scope{margin-bottom:6px;padding-bottom:6px!important;border-bottom:1px solid var(--border-hairline)!important}
.db-hot-people-list>legend{float:left;width:100%;padding:6px 8px 0;font:600 11px var(--font-sans);color:var(--text-secondary)}
.db-hot-people-hint{clear:both;margin:0;padding:2px 8px 6px;font:400 11px/1.4 var(--font-sans);color:var(--text-secondary)}
.db-hot-people-row{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 8px;border-radius:6px;font:500 12px/1.3 var(--font-sans);color:var(--text-primary);cursor:pointer}
.db-hot-people-row:hover{background:var(--bg-hover)}
.db-hot-people-row input{flex-shrink:0;width:16px;height:16px;margin:0;accent-color:var(--text-primary)}
.db-hot-people-foot{flex:none;display:flex;justify-content:flex-end;padding:8px;border-top:1px solid var(--border-hairline)}
.db-hot-people-done{min-height:34px;padding:0 16px;border:0;border-radius:7px;background:var(--text-primary);color:var(--bg-canvas);font:600 11px var(--font-sans)}

/* Hot Sheet: inbox chips */
.db-hot-inbox{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.db-hot-inbox-group{min-width:0;max-width:100%}
.db-hot-inbox-group[open]{flex-basis:100%}
.db-hot-inbox-group>summary{list-style:none;display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;min-height:36px;padding:6px 12px;border:1px solid var(--border-hairline);border-radius:var(--r-circle);background:transparent;color:var(--text-secondary);font:500 12px/1.3 var(--font-sans);cursor:pointer;transition:background var(--motion-fast) ease,border-color var(--motion-fast) ease}
.db-hot-inbox-group>summary:hover{background:var(--bg-hover);color:var(--text-primary)}
.db-hot-inbox-group>summary::-webkit-details-marker{display:none}
.db-hot-inbox-group>summary::after{content:'⌄';margin-top:-6px;font-size:12px;color:var(--text-tertiary)}
.db-hot-inbox-group[open]>summary{background:var(--bg-hover);border-color:var(--border-strong);color:var(--text-primary);font-weight:600}
.db-hot-inbox-group[open]>summary::after{content:'⌃';margin-top:6px}
.db-hot-inbox-group.is-overdue>summary{color:var(--status-danger)}
.db-hot-inbox-group.is-zero{display:none}
.db-hot-count{min-width:20px;padding:0 6px;border-radius:var(--r-circle);background:var(--bg-hover);color:var(--text-primary);font:600 12px/1.5 var(--font-sans);font-variant-numeric:tabular-nums;text-align:center}
.db-hot-inbox-group[open] .db-hot-count{background:var(--bg-canvas)}
.db-hot-split{font:500 12px var(--font-sans);color:var(--text-secondary)}
.db-hot-inbox-body{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px 0 16px}
.db-hot-note{grid-column:1/-1;margin:0 0 2px;font-size:12px;line-height:1.5;color:var(--text-secondary)}
.db-hot-empty{grid-column:1/-1;margin:0;font-size:12px;color:var(--text-tertiary)}
.db-hot-inbox-body .db-week-card{width:auto;margin:0;padding:12px 14px 13px;border-radius:10px}
.db-hot-blocker{font-size:11px;line-height:1.4;color:var(--text-secondary)}
.db-hot-blocker strong{font-weight:650;color:var(--text-primary)}

/* Shared metrics row (Home and the Workspace). Seven cards in the Home stat style: a dot and a sentence-case
   name on top, the figure below. Each card filters its view; the pressed card carries an inset ring. */
.hs-summary{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin:0 0 16px}
@media (max-width:1240px){.hs-summary{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:720px){.hs-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hs-stat{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;min-height:104px;padding:16px;border:0;border-radius:15px;background:var(--bg-canvas);box-shadow:var(--card-shadow);color:var(--text-primary);text-align:left;font:inherit;cursor:pointer;transition:box-shadow var(--motion-fast) ease}
@media (hover:hover){.hs-stat:hover{box-shadow:var(--card-shadow-lift)}}
.hs-stat[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--text-primary),var(--card-shadow)}
.hs-stat-name{order:-1;display:flex;align-items:center;gap:8px;font:600 12px/1.3 var(--font-sans);color:var(--text-secondary)}

.hs-stat-fig{font:500 36px/1 var(--font-display);letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.hs-stat-sub{font-size:12px;line-height:1.4;color:var(--text-tertiary)}
.hs-stat.is-danger{--stat-dot:var(--status-danger)}
.hs-stat.is-danger .hs-stat-fig{color:var(--status-danger)}
.hs-stat.is-warn{--stat-dot:var(--status-warn)}
.hs-stat.is-warn .hs-stat-fig{color:var(--status-warn-ink)}
.hs-stat.is-zero{--stat-dot:var(--text-tertiary)}
.hs-stat.is-zero .hs-stat-fig{color:var(--text-tertiary)}

/* Scope toggle (My team / Everyone), upper right on Home and the Workspace. */
.ds-scope{display:inline-flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--border-strong);border-radius:var(--r-circle);background:var(--bg-canvas);margin-left:auto}
.ds-scope-btn{min-height:32px;padding:0 14px;border:0;border-radius:var(--r-circle);background:transparent;color:var(--text-secondary);font:600 12px/1 var(--font-sans)}
.ds-scope-btn[aria-pressed="true"]{background:var(--text-primary);color:var(--bg-canvas)}
@media (hover:hover){.ds-scope-btn:not([aria-pressed="true"]):hover{background:var(--bg-hover);color:var(--text-primary)}}

/* Activity feed. Unread rows keep their kind color and add a red ring and a faint tint until the viewer reads them. */
.ds-activity{margin:0 0 16px;border:0;border-radius:15px;background:var(--bg-canvas);box-shadow:var(--card-shadow);overflow:hidden}
.ds-activity-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border-hairline)}
.ds-activity-title{display:flex;align-items:center;gap:8px;margin:0;font:600 14px/1.3 var(--font-sans);color:var(--text-primary)}
.ds-activity-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-circle);background:var(--status-danger-bg);color:var(--status-danger);font:700 11px/1 var(--font-sans);font-variant-numeric:tabular-nums}
.ds-activity-count.is-zero{display:none}
.ds-feed-pills{display:inline-flex;flex-wrap:wrap;gap:4px}
.ds-feed-pill{min-height:32px;padding:0 12px;border:1px solid var(--border-hairline);border-radius:var(--r-circle);background:transparent;color:var(--text-secondary);font:600 12px/1 var(--font-sans)}
.ds-feed-pill[aria-pressed="true"]{border-color:var(--text-primary);background:var(--text-primary);color:var(--bg-canvas)}
.ds-feed-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ds-feed-list{list-style:none;margin:0;padding:0;max-height:360px;overflow-y:auto;overscroll-behavior:contain}
.ds-feed-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--border-hairline)}
.ds-feed-list>.ds-feed-row:first-child{border-top:0}
@media (hover:hover){.ds-feed-row:hover{background:var(--bg-hover)}}
.ds-feed-row.is-unread{background:color-mix(in srgb,var(--text-primary) 4%,transparent)}
.ds-feed-row.is-unread .ds-feed-what{font-weight:600}
.ds-feed-dot{justify-self:center;width:8px;height:8px;border-radius:var(--r-circle);background:var(--text-tertiary)}
.ds-feed-row[data-kind="status"] .ds-feed-dot{background:var(--st-progress-ink)}
.ds-feed-row[data-kind="comment"] .ds-feed-dot{background:var(--st-client-ink)}
.ds-feed-row[data-kind="new"] .ds-feed-dot{background:var(--st-done-ink)}
.ds-feed-row.is-unread .ds-feed-dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--status-danger) 22%,transparent)}
.ds-feed-open{display:flex;flex-direction:column;gap:4px;min-width:0;padding:0;border:0;border-radius:4px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ds-feed-what{overflow:hidden;font:400 14px/1.35 var(--font-sans);color:var(--text-primary);text-overflow:ellipsis;white-space:nowrap}
.ds-feed-sub{overflow:hidden;font:400 12px/1.3 var(--font-sans);color:var(--text-secondary);text-overflow:ellipsis;white-space:nowrap}
.ds-feed-when{font:400 12px/1 var(--font-sans);color:var(--text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}
.ds-feed-read{min-height:32px;padding:0 4px;border:0;background:transparent;color:var(--text-secondary);font:600 12px/1 var(--font-sans);text-decoration:underline;text-underline-offset:3px;white-space:nowrap;cursor:pointer}
@media (hover:hover){.ds-feed-read:hover{color:var(--text-primary)}}
.ds-feed-empty{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0;padding:24px 16px;font-size:13px;color:var(--text-secondary);text-align:center}
@media (max-width:720px){.ds-activity-head{flex-direction:column;align-items:flex-start;gap:8px}}

/* Task page: ownership block (audit #17, #18, #21) */
.tp-ownership{margin:12px 0 0;padding:16px;border:1px solid var(--border-hairline);border-radius:var(--r-sm);background:var(--bg-subtle)}
.tp-ownership h4{margin:0 0 12px;font:600 13px/1.3 var(--font-sans);color:var(--text-primary)}
.tp-ownership dl{display:grid;grid-template-columns:120px 1fr;gap:4px 16px;margin:0;font-size:13px;line-height:1.5}
.tp-ownership dt{font-weight:600;color:var(--text-secondary)}
.tp-ownership dd{margin:0;color:var(--text-primary)}
.tp-ownership .tp-own-missing{color:var(--status-danger);font-weight:600}
.tp-ownership .tp-own-brief a{color:var(--text-primary);text-decoration:underline}

/* Task page: Quality Control checklist (audit #20) */
.tp-qc{margin:12px 0 0;padding:16px;border:1px solid var(--border-hairline);border-radius:var(--r-sm);background:var(--bg-subtle)}
.tp-qc h4{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 12px;font:600 13px/1.3 var(--font-sans);color:var(--text-primary)}
.tp-qc h4 .tp-qc-count{font:600 12px/1.3 var(--font-sans);color:var(--text-secondary)}
.tp-qc ul{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.tp-qc li{display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.5;color:var(--text-primary)}
.tp-qc-dot{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1px solid var(--border-strong);border-radius:var(--r-circle);background:var(--bg-canvas);color:var(--text-tertiary);font:600 11px/1 var(--font-sans)}
.tp-qc-dot.is-yes{border-color:var(--st-done-ink);background:var(--st-done-bg);color:var(--st-done-ink)}
.tp-qc-dot.is-no{border-color:var(--border-strong);background:var(--bg-canvas);color:var(--text-tertiary)}
.tp-qc-gate{display:flex;align-items:center;gap:8px;margin:12px 0 0;padding:8px 12px;border-radius:var(--r-xs);background:var(--st-done-bg);color:var(--st-done-ink);font:600 12px/1.4 var(--font-sans)}
.tp-qc-gate.is-wait{background:var(--status-warn-bg);color:var(--status-warn-ink)}

/* Task page: Brief gate (audit #21) */
.tp-brief-gate{display:flex;align-items:flex-start;gap:12px;margin:12px 0 0;padding:12px 16px;border:1px solid var(--status-danger);border-radius:var(--r-sm);background:var(--status-danger-bg);color:var(--status-danger);font:600 13px/1.5 var(--font-sans)}
.tp-brief-gate strong{display:block;margin:0 0 2px;font-weight:700}
.tp-brief-gate .tp-brief-note{display:block;margin-top:2px;font-weight:500;font-size:12px;color:var(--text-secondary)}

/* Hot Sheet: Weekly board */
.db-week-summary{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:0 0 16px;font-size:13px;color:var(--text-secondary)}
.db-week-summary p{margin:0}
/* The counts in the summary line are display numerals, the same Urbanist figure as the day numbers. */
.db-week-summary strong{margin-right:1px;font:600 20px/1 var(--font-display);letter-spacing:-0.03em;font-variant-numeric:tabular-nums;color:var(--text-primary);vertical-align:-2px}
.db-week-summary strong.is-late{color:var(--status-danger)}
.db-week-later{text-align:right}
.db-week-later .db-link{margin-left:6px}
.db-week-scroll{overflow-x:auto;overscroll-behavior-x:contain;margin:0 -12px;padding:4px 12px 16px}
.db-week-board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;align-items:start}
.db-week-day{min-width:0}
.db-week-day.is-today{margin:0 calc(-1 * var(--hot-bleed));padding:0 var(--hot-bleed) 10px;border-radius:0 0 12px 12px;background:var(--today-tint)}
.db-week-day-heading{margin:0;font-size:inherit;font-weight:inherit}
.db-week-day-heading>button,.db-stat-head{display:flex;align-items:center;gap:10px;width:calc(100% + 2 * var(--hot-bleed));margin:0 calc(-1 * var(--hot-bleed));padding:8px var(--hot-bleed) 12px;border:0;border-bottom:1px solid var(--border-hairline);background:transparent;color:var(--text-primary);text-align:left}
.db-week-num{min-width:36px;font:500 30px/1 var(--font-display);letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.db-week-day.is-today .db-week-num{color:var(--brand-red)}
.db-week-day-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.db-week-day-name{display:flex;align-items:center;gap:6px;font:600 13px/1.2 var(--font-sans)}
.db-week-today{font:600 11px/1 var(--font-sans);color:var(--brand-red)}
.db-week-day-count{font-size:11px;color:var(--text-secondary)}
.db-week-list{display:flex;flex-direction:column;gap:6px;padding-top:2px}
/* A card is outlined in its client's color all the way round, with a faint fill of the same color. Hover and
   focus bring the edge to full strength. On hold goes dashed with no fill. The client's name stays on the card. */
.db-week-card{position:relative;display:flex;flex-direction:column;gap:4px;width:100%;margin:0;padding:10px 12px 11px;border:1px solid color-mix(in srgb,var(--week-client) var(--card-edge),transparent);border-radius:8px;background:color-mix(in srgb,var(--week-client) var(--card-tint),var(--bg-canvas));color:var(--text-primary);text-align:left;font:inherit;transition:border-color var(--motion-fast) ease,box-shadow var(--motion-fast) ease,transform var(--motion-fast) ease}
.db-week-card.is-hold{border-style:dashed;background:var(--bg-canvas)}
/* The client's name is the card's label: small caps in the client's color, the house label style. */
.db-week-card-client{overflow:hidden;font:var(--fw-label) 10.5px/1.4 var(--font-label);letter-spacing:0.07em;text-transform:uppercase;text-overflow:ellipsis;white-space:nowrap;color:color-mix(in srgb,var(--week-client) var(--client-ink-pct),var(--text-primary))}
.db-week-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font:550 12px/1.3 var(--font-sans);color:var(--text-secondary)}
.db-week-pri{flex:none;width:7px;height:7px;border-radius:var(--r-circle);background:var(--brand-red)}
.db-week-card-title{font:650 14px/1.3 var(--font-sans);letter-spacing:-0.005em;color:var(--text-primary)}
.db-week-parent{font-size:12px;line-height:1.35;color:var(--text-tertiary)}
.db-week-card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;font-size:12px;color:var(--text-secondary)}
.db-week-card-kind{display:inline-flex;flex:1 1 auto;align-items:center;flex-wrap:wrap;gap:4px 6px;min-width:0}
.db-week-card-owner{display:inline-flex;flex:0 1 auto;max-width:55%;min-width:0;justify-content:flex-end}
/* Status chip. One flat tint per status, the same chip on cards, rows, board headings and the dialog. */
.st-chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:2px 8px;border:1px solid transparent;border-radius:5px;background:var(--st-bg,var(--bg-hover));color:var(--st-ink,var(--text-secondary));font:650 12px/1.45 var(--font-sans);white-space:nowrap}
.st-chip.is-hold{border-color:var(--st-ink);border-style:dashed}
.st-k-queue{--st-bg:var(--st-queue-bg);--st-ink:var(--st-queue-ink)}
.st-k-intake{--st-bg:var(--st-intake-bg);--st-ink:var(--st-intake-ink)}
.st-k-progress{--st-bg:var(--st-progress-bg);--st-ink:var(--st-progress-ink)}
.st-k-review{--st-bg:var(--st-review-bg);--st-ink:var(--st-review-ink)}
.st-k-qc{--st-bg:var(--st-qc-bg);--st-ink:var(--st-qc-ink)}
.st-k-client{--st-bg:var(--st-client-bg);--st-ink:var(--st-client-ink)}
.st-k-hold{--st-bg:var(--st-hold-bg);--st-ink:var(--st-hold-ink)}
.st-k-done{--st-bg:var(--st-done-bg);--st-ink:var(--st-done-ink)}
/* Overdue is the one red label on a card. */
.db-week-card-late{display:inline-flex;align-items:center;padding:2px 7px;border:1px solid currentColor;border-radius:5px;background:var(--status-danger-bg);font:650 12px/1.45 var(--font-sans);color:var(--status-danger);white-space:nowrap}
/* Due date is a small badge, the way a board card carries its date; late turns it red. */
.db-week-card-due{align-self:flex-start;margin-top:2px;padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--text-primary) 6%,transparent);font:650 11.5px/1.4 var(--font-sans);font-variant-numeric:tabular-nums;color:var(--text-secondary)}
.db-week-card-due.is-late{background:var(--status-danger-bg);color:var(--status-danger)}
/* Owner: initials in a circle tinted with the client's color, the first name beside it. Unassigned is a dashed empty circle. */
.av{display:inline-flex;align-items:center;gap:6px;min-width:0;font:600 12px/1.3 var(--font-sans);color:var(--text-secondary)}
.av-i{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:var(--r-circle);background:color-mix(in srgb,var(--week-client,var(--text-secondary)) 14%,var(--bg-canvas));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--week-client,var(--text-secondary)) 32%,transparent);color:color-mix(in srgb,var(--week-client,var(--text-secondary)) 78%,var(--text-primary));font:700 10px/1 var(--font-sans);letter-spacing:0.02em}
.av.is-unassigned .av-i{border:1px dashed var(--border-strong);background:transparent;color:var(--text-tertiary)}
.av-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-week-empty{margin:0;padding:14px 0;border-bottom:1px solid var(--hot-rule);font-size:12px;color:var(--text-tertiary)}
.db-hot-shell .db-week-day-heading>button:focus-visible{outline-offset:-2px}
.db-hot-shell .db-week-card:focus-visible{outline-offset:2px;border-color:var(--week-client)}
@media (hover:hover){
.db-hot-views button:not(.on):hover{background:var(--bg-hover);color:var(--text-primary)}
.db-hot-step:hover{background:var(--bg-hover)}
.db-week-day-heading>button:hover,.cb-grid .cb-bar.is-hold:hover,.db-week-card.is-hold:hover{background:var(--bg-hover)}
.db-week-card:not(.is-hold):hover,.cb-grid .cb-bar:not(.is-hold):hover{border-color:var(--week-client);box-shadow:0 0 0 1px var(--week-client)}
.db-week-card:not(.is-hold):hover{transform:translateY(-1px);box-shadow:0 0 0 1px var(--week-client),0 10px 24px -12px rgba(10,10,12,0.35)}
.db-stat-board .db-week-card:not(.is-hold):hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--week-client),0 14px 28px -12px rgba(10,10,12,0.40)}
.db-stat-board .db-week-card:active{cursor:grabbing}
}

/* Hot Sheet: Status tab. Eight lists, one per status, 232px each, scrolling sideways inside the region. A list is a
   grey panel with a status dot, a count pill in that status's tint, and client-outlined cards that lift on hover.
   Cards drag between lists with the pointer, or move with [ and ] from the keyboard. */
.db-week-board.db-stat-board{grid-template-columns:repeat(8,232px);gap:12px;align-items:start;padding-bottom:4px}
.db-stat-board .db-week-day{display:flex;flex-direction:column;min-height:180px;padding:8px 8px 12px;border-radius:12px;background:var(--board-col);transition:background var(--motion-fast) ease,box-shadow var(--motion-fast) ease}
.db-stat-board .db-week-day.is-over{background:color-mix(in srgb,var(--st-ink) 10%,var(--bg-canvas));box-shadow:inset 0 0 0 2px var(--st-ink)}
.db-stat-board .db-stat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;width:auto;margin:0;padding:4px 4px 8px;border:0}
.db-stat-board .db-week-day-name{display:flex;align-items:center;gap:7px;font-weight:700}
.db-stat-board .db-week-day-name::before{content:'';flex:none;width:8px;height:8px;border-radius:var(--r-circle);background:var(--st-ink)}
.db-stat-n{min-width:24px;padding:2px 7px;border:1px solid color-mix(in srgb,var(--st-ink) 24%,transparent);border-radius:var(--r-circle);background:var(--st-bg);font:700 11px/1.4 var(--font-sans);font-variant-numeric:tabular-nums;text-align:center;color:var(--st-ink)}
.db-stat-board .db-week-card.is-done .db-week-card-title{color:var(--text-secondary)}
.db-stat-board .db-week-list{display:flex;flex-direction:column;flex:1;gap:8px;min-height:44px;border-radius:8px}
.db-stat-board .db-week-list.is-empty{border:1px dashed var(--border-strong)}
.db-stat-board .db-week-card{width:100%;margin:0;padding:10px 12px 11px;border-radius:8px;box-shadow:0 1px 2px rgba(10,10,12,0.06),0 2px 6px -4px rgba(10,10,12,0.10);overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.db-stat-board .db-week-card.is-dragging{opacity:.35}
.db-stat-board .db-week-empty{margin:auto 0;padding:10px 6px;border:0;text-align:center}
.drag-ghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;transform:rotate(3deg) scale(1.02);opacity:.96}
.drag-ghost .db-week-card{margin:0;width:100%;border-color:var(--week-client);border-radius:8px;box-shadow:0 0 0 1px var(--week-client),0 18px 40px -12px rgba(10,10,12,0.45);overflow:hidden;cursor:grabbing}
.db-stat-hint{display:inline}
.announce{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* Hot Sheet: Day view */
.db-day-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin:0 0 18px}
.db-day-head h2{margin:0;font:500 26px/1.1 var(--font-display);letter-spacing:-0.03em}
.db-day-head p{margin:0;font-size:12px;color:var(--text-secondary)}
.db-day-group{margin:0 calc(-1 * var(--hot-bleed)) 26px}
.db-day-group-client{display:flex;align-items:center;gap:8px;margin:0;padding:0 var(--hot-bleed) 8px;border-bottom:2px solid var(--hot-ink);font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.db-day-group-client::before{content:'';flex:none;width:8px;height:8px;border-radius:var(--r-circle);background:var(--week-client)}
.db-day-group-client span{color:var(--text-secondary)}
/* Each client group is a column of outlined rows under its heading; the rows sit inside the bleed. */
.db-day-group{display:flex;flex-direction:column;gap:6px}
.db-day-group-client{margin-bottom:2px}
.db-day-list .db-week-card{display:grid;grid-template-columns:14px minmax(0,1fr) 230px 150px;align-items:center;gap:2px 14px;width:auto;margin:0 var(--hot-bleed);padding:10px 12px 11px}
.db-day-list .db-week-card-top{grid-column:1;grid-row:1;justify-content:center;min-height:1em}
.db-day-list .db-week-card-client{display:none}
.db-day-list .db-week-card-title{grid-column:2;grid-row:1;font-size:14px}
.db-day-list .db-week-parent{grid-column:2;grid-row:2}
.db-day-list .db-week-card-meta{display:contents}
.db-day-list .db-week-card-kind{grid-column:3;grid-row:1}
.db-day-list .db-week-card-owner{grid-column:4;grid-row:1;max-width:none;font-size:12px;color:var(--text-primary)}
.db-day-list .db-week-card-due{display:none}
.db-day-empty{margin:0;padding:28px 0;font-size:12px;color:var(--text-tertiary);border-top:2px solid var(--hot-ink)}

/* Hot Sheet: Calendar (new). Week is people by day, Month is weeks by day. A bar runs from start date to due date, weekdays only. */
.cm{padding:14px 16px 8px;border-radius:15px;background:var(--bg-canvas);box-shadow:var(--card-shadow)}
.db-cal-head{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:2px solid var(--hot-ink)}
.db-cal-head span{padding:0 10px 8px;font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.cm-weeks{margin:0;padding:0;list-style:none}
.cm-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));pointer-events:none}
.cm-cols span{border-left:1px solid var(--border-hairline)}
.cm-cols span:last-child{border-right:1px solid var(--border-hairline)}
.cm-cols span.is-today{background:var(--today-tint)}
.cm-cols span.is-out{background:color-mix(in srgb,var(--text-primary) 3%,var(--bg-canvas))}
.cm-week{position:relative;min-height:112px;border-bottom:1px solid var(--border-hairline)}
.cm-days{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 0 0}
.cm-day{display:flex;align-items:center;gap:6px;margin:0;padding:0 10px}
.db-cal-num{font:500 18px/1 var(--font-display);letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.cm-day.is-out .db-cal-num{opacity:.5}
.cm-day.is-today .db-cal-num{color:var(--brand-red)}
.cb-grid{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));row-gap:4px;margin:0;padding:6px 0 8px;list-style:none}
.cb-grid>li{min-width:0;padding:0 4px}
.cb-grid>li.is-cl{padding-left:0}
.cb-grid>li.is-cr{padding-right:0}
.cb-c1{grid-column-start:1}.cb-c2{grid-column-start:2}.cb-c3{grid-column-start:3}.cb-c4{grid-column-start:4}.cb-c5{grid-column-start:5}
.cb-s1{grid-column-end:span 1}.cb-s2{grid-column-end:span 2}.cb-s3{grid-column-end:span 3}.cb-s4{grid-column-end:span 4}.cb-s5{grid-column-end:span 5}
.cb-l1{grid-row-start:1}.cb-l2{grid-row-start:2}.cb-l3{grid-row-start:3}.cb-l4{grid-row-start:4}.cb-l5{grid-row-start:5}.cb-l6{grid-row-start:6}
.cb-l7{grid-row-start:7}.cb-l8{grid-row-start:8}.cb-l9{grid-row-start:9}.cb-l10{grid-row-start:10}.cb-l11{grid-row-start:11}.cb-l12{grid-row-start:12}
.cb-l13{grid-row-start:13}.cb-l14{grid-row-start:14}.cb-l15{grid-row-start:15}.cb-l16{grid-row-start:16}.cb-l17{grid-row-start:17}.cb-l18{grid-row-start:18}
.cb-l19{grid-row-start:19}.cb-l20{grid-row-start:20}.cb-l21{grid-row-start:21}.cb-l22{grid-row-start:22}.cb-l23{grid-row-start:23}.cb-l24{grid-row-start:24}
.cb-l25{grid-row-start:25}.cb-l26{grid-row-start:26}.cb-l27{grid-row-start:27}.cb-l28{grid-row-start:28}.cb-l29{grid-row-start:29}.cb-l30{grid-row-start:30}
.cb-l31{grid-row-start:31}.cb-l32{grid-row-start:32}.cb-l33{grid-row-start:33}.cb-l34{grid-row-start:34}.cb-l35{grid-row-start:35}.cb-l36{grid-row-start:36}
.cb-l37{grid-row-start:37}.cb-l38{grid-row-start:38}.cb-l39{grid-row-start:39}.cb-l40{grid-row-start:40}
/* Month bars are a light tint of the client's color inside a thin outline of that color, so the grid shows through and
   neighbors still separate. The client name takes the client's color, darkened to clear 4.5:1. On hold stays a dashed outline. */
.cb-bar{position:relative;display:flex;align-items:center;gap:6px;width:100%;min-width:0;padding:3px 7px;border:1px solid color-mix(in srgb,var(--week-client) var(--card-edge),transparent);border-radius:6px;background:color-mix(in srgb,var(--week-client) var(--bar-tint),var(--bg-canvas));color:var(--text-primary);text-align:left;font:inherit;overflow:hidden;transition:border-color var(--motion-fast) ease,box-shadow var(--motion-fast) ease}
.cb-bar .cb-client{color:color-mix(in srgb,var(--week-client) var(--client-ink-pct),var(--text-primary))}
.cb-bar.is-hold{border-style:dashed;background:var(--bg-canvas);box-shadow:none;color:var(--text-primary)}
.cb-bar.is-cont-l{border-top-left-radius:0;border-bottom-left-radius:0}
.cb-bar.is-cont-r{border-top-right-radius:0;border-bottom-right-radius:0}
.cb-client{flex:none;max-width:40%;min-width:0;overflow:hidden;font:600 11px/1.3 var(--font-sans);text-overflow:ellipsis;white-space:nowrap}
.cb-bar.is-hold .cb-client{color:color-mix(in srgb,var(--week-client) var(--client-ink-pct),var(--text-secondary))}
.cb-title{display:block;flex:1 1 auto;min-width:0;overflow:hidden;font:600 12px/1.3 var(--font-sans);text-overflow:ellipsis;white-space:nowrap}
.cb-bar.is-step .cb-title{font-weight:500}
.cb-cont{flex:none;font:600 12px/1 var(--font-sans)}
.cb-bar.is-hold .cb-cont{color:var(--text-tertiary)}
.cb-cont.is-r{margin-left:auto}
.cb-bar .db-week-card-late{flex:none;padding:0 5px;background:var(--bg-canvas)}
.db-cal-more{justify-self:start;padding:2px 6px;border:0;background:none;color:var(--text-secondary);font:600 11px var(--font-sans);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.db-hot-shell .cb-bar:focus-visible,.db-hot-shell .db-cal-more:focus-visible,.db-hot-shell .cl-item:focus-visible{outline-offset:1px}
.cl{display:none}
.cl-group{margin:0 0 22px}
.cl-name{display:flex;align-items:baseline;gap:8px;margin:0;padding:0 0 8px;border-bottom:2px solid var(--hot-ink);font:600 13px/1.3 var(--font-sans)}
.cl-name span{font-size:11px;font-weight:500;color:var(--text-secondary)}
.cl-items{margin:0;padding:0;list-style:none}
.cl-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font:550 11px/1.3 var(--font-sans);color:var(--text-secondary)}
/* The phone list tints with the client's color, like the month bars. On hold stays a dashed outline. */
.cl-items>li+li{margin-top:4px}
.cl-item{padding:9px 12px 10px;border-radius:6px}
.cl-range{font-size:12px;color:var(--text-secondary)}

/* Status (new) */
.st-section{margin:0 0 44px}
.st-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 12px}
.st-strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr)) auto;border:0;border-radius:15px;background:var(--bg-canvas);box-shadow:var(--card-shadow);overflow:hidden}
.st-cell{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0;min-height:104px;padding:14px 12px 16px;border:0;border-right:1px solid var(--border-hairline);background:transparent;color:var(--text-primary);text-align:left}
.st-cell.is-split{margin-left:-1px;border-left:1px solid var(--border-strong)}
.st-cell-name{display:flex;align-items:flex-start;gap:6px;font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.st-cell-name::before{content:'';flex:none;width:8px;height:8px;margin-top:3px;border-radius:var(--r-circle);background:var(--st-ink)}
.st-cell-n{font:500 40px/1 var(--font-display);letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.st-cell.is-zero .st-cell-n{opacity:.55}
.st-cell[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--hot-ink)}
.st-strip-meta{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 16px 16px}
.st-filter-note{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin:14px 0 0;font-size:12px;color:var(--text-secondary)}
.st-panel{margin-top:22px;padding:6px 20px 10px}
.st-panel .st-group:last-child{margin-bottom:0}
.st-list{margin-top:0}
.st-group{margin:0 0 22px}
.st-group-h{display:flex;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--border-hairline)}
.st-group-n{color:var(--text-secondary)}
.st-rows{margin:0;padding:0;list-style:none}
.st-row{display:grid;grid-template-columns:28px 124px minmax(0,1fr) 126px 96px 92px 116px;align-items:center;gap:14px;width:calc(100% + 16px);margin:0 -8px;padding:10px 8px;border:0;border-bottom:1px solid var(--border-hairline);background:transparent;color:var(--text-primary);text-align:left;font:inherit}
.st-row>.st-meta{display:contents}
.st-stat{min-width:0}
/* A project's steps sit under it, each with its own status. */
.st-subs{margin:0;padding:0;list-style:none}
.st-sub{background:var(--bg-subtle)}
.st-sub-mark{display:grid;place-items:center;width:28px;height:28px;color:var(--text-tertiary);font-size:14px}
.st-sub .st-client{color:var(--text-tertiary)}
.st-sub .st-title{font-weight:500}
.st-mono{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--mono-c) 14%,var(--bg-canvas));color:color-mix(in srgb,var(--mono-c) var(--client-ink-pct),var(--text-primary));font:700 13px/1 var(--font-sans);letter-spacing:-0.01em}
.st-client{overflow:hidden;font:550 12px var(--font-sans);color:var(--text-secondary);text-overflow:ellipsis;white-space:nowrap}
.st-title{min-width:0;font:600 13px/1.35 var(--font-sans)}
.st-owner,.st-due{font-size:12px;color:var(--text-secondary)}
.st-due.is-late{font-weight:600;color:var(--status-danger)}
.st-days{font-size:11px;color:var(--text-tertiary)}
.st-empty{margin:0;padding:14px 0;border-bottom:1px solid var(--border-hairline);font-size:12px;color:var(--text-tertiary)}
.st-foot{max-width:880px;margin:18px 0 0;font-size:12px;line-height:1.6;color:var(--text-secondary)}
@media (hover:hover){.st-cell:hover,.st-row:hover{background:var(--bg-hover)}}

/* Standup (new) */
.su-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 18px}
.su-times{margin:6px 0 0;font-size:13px;color:var(--text-secondary)}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg-canvas);color:var(--text-primary);font:600 12px var(--font-sans);white-space:nowrap}
.btn-secondary:hover{background:var(--bg-hover)}
.btn-secondary[aria-pressed="true"]{border-color:var(--text-primary)}
.su-run{position:sticky;top:12px;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 18px;padding:10px 12px;border:1px solid var(--text-primary);border-radius:8px;background:var(--bg-canvas)}
.su-run-count{margin:0;font-size:13px}
.su-run-count strong{font-weight:650}
.su-run-hint{margin-left:auto;font-size:11px;color:var(--text-tertiary)}
.su-flag{margin:0 0 30px}
.su-flag-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px;border-top:1px solid var(--border-hairline);border-bottom:1px solid var(--border-hairline)}
.su-flag-cell{display:flex;flex-direction:column;gap:8px;min-width:0;padding:12px 16px 14px;border-right:1px solid var(--border-hairline)}
.su-flag-cell:first-child{padding-left:0}
.su-flag-cell:last-child{border-right:0}
.su-flag-name{font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.su-flag-n{margin:0;font:500 40px/1 var(--font-display);letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.su-flag-n.is-late{color:var(--status-danger)}
.su-flag-n small{margin-left:6px;font:600 12px var(--font-sans);letter-spacing:0;color:var(--text-secondary)}
.su-flag-item{margin:0;font-size:12px;color:var(--text-secondary)}
.su-panel .su-team:last-child{margin-bottom:0}
.su-team{margin:0 0 26px}
.su-team-h{padding-bottom:8px;border-bottom:2px solid var(--hot-ink)}
.su-cols,.su-row{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));gap:16px;padding-left:12px}
.su-cols{padding-top:8px;padding-bottom:6px;border-bottom:1px solid var(--border-hairline)}
.su-cols span{font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.su-rows{margin:0;padding:0;list-style:none}
.su-row{padding-top:10px;padding-bottom:11px;border-bottom:1px solid var(--border-hairline)}
.su-row.is-dim{opacity:.35}
.su-row.is-current{box-shadow:inset 2px 0 0 var(--hot-ink)}
.su-name{display:block;font:600 13px var(--font-sans)}
.su-lead{display:block;margin-top:2px;font-size:11px;color:var(--text-tertiary)}
.su-cell{min-width:0}
.su-cell ul{display:flex;flex-direction:column;gap:3px;margin:0;padding:0;list-style:none}
.su-cell li{font-size:12px;line-height:1.4;color:var(--text-primary)}
.su-more{color:var(--text-secondary)}
.su-none{font-size:12px;color:var(--text-placeholder)}
.su-why{font-size:11px;color:var(--text-tertiary)}
.su-cell-label{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* Task dialog (new). Opens from any card, bar or Status row. */
.dlg{width:min(560px,calc(100vw - 32px));max-width:none;max-height:calc(100vh - 32px);padding:0;border:1px solid var(--border-hairline);border-radius:15px;background:var(--bg-canvas);color:var(--text-primary);box-shadow:var(--shadow-menu)}
.dlg::backdrop{background:var(--scrim)}
.dlg-body{display:flex;flex-direction:column;gap:12px;margin:0;padding:20px 22px 18px}
.dlg-head{display:flex;flex-direction:column;gap:8px}
.dlg-eyebrow-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dlg-title-row{display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px 12px}
.dlg-title{flex:1 1 240px;margin:-4px 0 0;font:500 24px/1.15 var(--font-display);letter-spacing:-0.03em}
.dlg-title-row .st-chip{margin-top:3px;font-size:13px;padding:3px 10px}
.dlg-step .st-chip{font-size:12.5px;padding:2.5px 9px}
.dlg-fact-status dd{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.dlg-fact-days{font:500 12px/1.3 var(--font-sans);color:var(--text-secondary)}
.dlg-parent{margin:-2px 0 0;font-size:12px;color:var(--text-secondary)}
.dlg-parent .db-link{font-size:12px}
.dlg-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:4px 0 0;padding:12px 0;border-top:1px solid var(--border-hairline);border-bottom:1px solid var(--border-hairline)}
.dlg-section{margin:6px 0 -6px;font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.dlg-steps{margin:0;padding:0;list-style:none;border-top:1px solid var(--border-hairline)}
.dlg-step{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;width:calc(100% + 16px);margin:0 -8px;padding:9px 8px;border:0;border-bottom:1px solid var(--border-hairline);background:transparent;color:var(--text-primary);text-align:left;font:inherit}
.dlg-step:hover{background:var(--bg-hover)}
.dlg-step-title{display:block;font:600 13px/1.35 var(--font-sans)}
.dlg-step-sub{display:block;margin-top:2px;font-size:12px;color:var(--text-secondary)}
.dlg-step-due{font-size:12px;color:var(--text-secondary);white-space:nowrap}
.dlg-step-due.is-late{font-weight:600;color:var(--status-danger)}
.dlg-facts dt{font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.dlg-facts dd{margin:4px 0 0;font:600 13px/1.35 var(--font-sans)}
.dlg-field{display:flex;flex-direction:column;gap:6px}
.dlg-field label{font:600 12px var(--font-sans);color:var(--text-secondary)}
.dlg-field select{height:38px;padding:0 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg-canvas);color:var(--text-primary);font:600 13px var(--font-sans)}
.dlg-hint,.dlg-note{margin:0;font-size:12px;line-height:1.5;color:var(--text-secondary)}
.dlg-live{margin:0;min-height:18px;font-size:12px;font-weight:600;color:var(--text-primary)}
.dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px;padding-top:12px;border-top:1px solid var(--border-hairline)}
.ph-panel strong{font-weight:650;color:var(--text-primary)}

/* Shared by the new views (round 5): a panel is the same 15px radius card the toolbar uses, a figure is the Urbanist
   numeral the strip and the standup already use, and a client-tinted panel reuses --week-client the way a card does. */
.panel{padding:18px 20px;border:0;border-radius:15px;background:var(--bg-canvas);box-shadow:var(--card-shadow)}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.panel-h .eyebrow{margin:0}
.panel-h .db-link{font-size:11px}
.fig{font:500 40px/1 var(--font-display);letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.fig.is-late{color:var(--status-danger)}
.fig.is-zero{color:var(--text-tertiary)}
.empty{margin:0;padding:12px 0;font-size:12px;color:var(--text-tertiary)}
.cards-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cards-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cards-2 .db-week-card,.cards-3 .db-week-card{width:auto;margin:0;padding:12px 14px 13px;border-radius:10px}

/* Home. Four figures across the top, then my work beside what needs a look. */
.hm-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 14px}
.hm-stat{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-height:112px;padding:16px 18px 15px;border:0;border-radius:15px;background:var(--bg-canvas);box-shadow:var(--card-shadow);color:var(--text-primary);text-align:left;transition:border-color var(--motion-fast) ease,box-shadow var(--motion-fast) ease,transform var(--motion-fast) ease}
.hm-stat-name{display:flex;align-items:center;gap:7px;font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.hm-stat-name::before{content:'';flex:none;width:8px;height:8px;border-radius:var(--r-circle);background:var(--stat-dot,var(--hot-ink))}
.hm-stat.is-late{--stat-dot:var(--status-danger)}
.hm-stat.is-today{--stat-dot:var(--brand-red)}
.hm-stat-row{display:flex;align-items:baseline;gap:10px;width:100%}
.hm-stat-sub{font:600 12px/1.3 var(--font-sans);color:var(--text-secondary)}
.hm-roll{margin:0 0 24px;font-size:12px;color:var(--text-secondary)}
.hm-roll strong{font-weight:650;color:var(--text-primary)}
.hm-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.hm-col{display:flex;flex-direction:column;gap:16px;min-width:0}
/* Needs attention: a compact row with the reason as a chip-shaped label. */
.att-list{margin:0;padding:0;list-style:none}
.att-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:12px;width:calc(100% + 16px);margin:0 -8px;padding:9px 8px;border:0;border-bottom:1px solid var(--border-hairline);background:transparent;color:var(--text-primary);text-align:left;font:inherit}
.att-list li:last-child .att-row{border-bottom:0}
.att-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.att-title{overflow:hidden;font:600 13px/1.35 var(--font-sans);text-overflow:ellipsis;white-space:nowrap}
.att-sub{overflow:hidden;font-size:12px;color:var(--text-secondary);text-overflow:ellipsis;white-space:nowrap}
.att-why{padding:2px 8px;border-radius:5px;background:var(--bg-hover);font:650 11.5px/1.45 var(--font-sans);color:var(--text-secondary);white-space:nowrap}
.att-why.is-late{background:var(--status-danger-bg);color:var(--status-danger)}
.att-why.is-client{background:var(--st-client-bg);color:var(--st-client-ink)}
.att-why.is-hold{background:var(--st-hold-bg);color:var(--st-hold-ink)}
/* Client strip: one outlined chip per client with its open count, the same outline the cards carry. */
.cs-list{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.cs-chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 10px 4px 5px;border:1px solid color-mix(in srgb,var(--week-client) var(--card-edge),transparent);border-radius:var(--r-circle);background:color-mix(in srgb,var(--week-client) var(--card-tint),var(--bg-canvas));color:var(--text-primary);font:600 12px/1.3 var(--font-sans);transition:border-color var(--motion-fast) ease,box-shadow var(--motion-fast) ease}
.cs-chip .st-mono{width:26px;height:26px;border-radius:var(--r-circle);font-size:11px}
.cs-chip-n{min-width:22px;padding:1px 7px;border-radius:var(--r-circle);background:color-mix(in srgb,var(--text-primary) 7%,transparent);font:700 11px/1.5 var(--font-sans);text-align:center;color:var(--text-secondary)}
/* Next deadlines: date on the left in the display face, item on the right. */
.nd-list{margin:0;padding:0;list-style:none}
.nd-row{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:12px;width:calc(100% + 16px);margin:0 -8px;padding:8px 8px;border:0;border-bottom:1px solid var(--border-hairline);background:transparent;color:var(--text-primary);text-align:left;font:inherit}
.nd-list li:last-child .nd-row{border-bottom:0}
.nd-date{display:flex;flex-direction:column;line-height:1}
.nd-date b{font:500 22px/1 var(--font-display);letter-spacing:-0.04em}
.nd-date small{margin-top:3px;font:var(--fw-label) 10px/1 var(--font-label);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary)}
.nd-date.is-today b{color:var(--brand-red)}
.nd-date.is-late b{color:var(--status-danger)}

/* Task page. The header panel is outlined and tinted in the client color, the title is the masthead, and the facts
   run across under it. The body is the steps and brief beside a rail with Move to, the hold panel and the activity. */
.tp-back{margin:0 0 16px}
.tp-head{position:relative;margin:0 0 20px;padding:22px 24px 20px;border:1px solid color-mix(in srgb,var(--week-client) var(--card-edge),transparent);border-radius:15px;background:color-mix(in srgb,var(--week-client) var(--card-tint),var(--bg-canvas))}
.tp-eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin:0 0 12px}
.tp-eyebrow .st-mono{width:24px;height:24px;border-radius:8px;font-size:11px}
.tp-client{display:inline-flex;align-items:center;gap:8px;color:color-mix(in srgb,var(--week-client) var(--client-ink-pct),var(--text-primary))}
.tp-title-row{display:flex;align-items:flex-start;flex-wrap:wrap;gap:8px 14px}
.tp-title{flex:1 1 320px;max-width:760px;font-size:clamp(26px,1.4vw+18px,34px);line-height:1.1}
.tp-title-row .st-chip{margin-top:8px;font-size:13px;padding:3px 10px}
.tp-parent{margin:8px 0 0;font-size:13px;color:var(--text-secondary)}
.tp-parent .db-link{font-size:13px}
.tp-facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin:18px 0 0;padding:14px 0 0;border-top:1px solid color-mix(in srgb,var(--week-client) 30%,var(--border-hairline))}
.tp-facts dt{font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.tp-facts dd{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:5px 0 0;font:600 13px/1.35 var(--font-sans)}
.tp-facts .av{color:var(--text-primary)}
.tp-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.tp-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.tp-brief{margin:0;font-size:13px;line-height:1.6;color:var(--text-secondary)}
.tp-brief+.tp-brief{margin-top:8px}
.tp-files{margin:0;padding:0;list-style:none}
.tp-file{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-hairline)}
.tp-files li:last-child .tp-file{border-bottom:0}
.tp-ext{display:grid;place-items:center;height:26px;border-radius:6px;background:color-mix(in srgb,var(--week-client) 12%,var(--bg-canvas));font:500 10px/1 var(--font-mono);letter-spacing:0.04em;text-transform:uppercase;color:color-mix(in srgb,var(--week-client) var(--client-ink-pct),var(--text-primary))}
.tp-file-name{overflow:hidden;font:600 13px/1.35 var(--font-sans);text-overflow:ellipsis;white-space:nowrap}
.tp-file-meta{font-size:12px;color:var(--text-tertiary);white-space:nowrap}
.tp-move .dlg-field{margin-top:2px}
.tp-status-now{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin:0 0 12px;padding:0 0 12px;border-bottom:1px solid var(--border-hairline)}
.tp-status-label{font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.tp-status-now .st-chip{font-size:13px;padding:3px 10px}
.tp-status-days{font-size:12px;color:var(--text-secondary)}
.tp-facts .tp-fact-status dd{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.tp-hold{border-style:dashed;border-color:var(--st-hold-ink);background:var(--bg-canvas)}
.tp-hold .eyebrow{color:var(--st-hold-ink)}
.tp-hold p{margin:6px 0 0;font-size:13px;line-height:1.5}
.tp-hold strong{font-weight:650}
/* Timeline. Business days from the project start to its due date (or today when it's late), one row per step.
   Work bars take the client outline and tint like the cards, internal reviews the review purple, client reviews the
   client yellow, and a milestone is a diamond on its day. Today is a brand-red hairline. gt- never cl-. */
.gt-facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:0 0 14px;padding:0 0 14px;border-bottom:1px solid var(--border-hairline)}
.gt-facts dt{font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.gt-facts dd{margin:4px 0 0;font:600 13px/1.35 var(--font-sans)}
.gt-facts dd.is-late{color:var(--status-danger)}
.gt-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;font-size:11px;color:var(--text-secondary)}
.gt-legend span{display:inline-flex;align-items:center;gap:6px}
.gt-legend i{width:12px;height:8px;border-radius:2px;border:1px solid color-mix(in srgb,var(--week-client) var(--card-edge),transparent);background:color-mix(in srgb,var(--week-client) var(--bar-tint),var(--bg-canvas))}
.gt-legend .gt-k-review i{border-color:var(--st-review-ink);background:var(--st-review-bg)}
.gt-legend .gt-k-client i{border-color:var(--st-client-ink);background:var(--st-client-bg)}
.gt-legend .gt-k-milestone i{width:8px;height:8px;border:0;border-radius:1px;background:var(--text-primary);transform:rotate(45deg)}
.gt-scroll{overflow:auto;border:1px solid var(--border-hairline);border-radius:10px;background:var(--bg-canvas)}
.gt{min-width:640px}
.gt-axis,.gt-row,.gt-proj{display:grid;grid-template-columns:240px minmax(400px,1fr)}
.gt-axis{position:sticky;top:0;z-index:3;height:34px;border-bottom:1px solid var(--border-strong);background:var(--bg-canvas);font:500 10px/1 var(--font-mono);letter-spacing:0.02em;color:var(--text-tertiary)}
.gt-axis>strong{position:sticky;left:0;z-index:4;padding:12px 14px;background:var(--bg-canvas);font:var(--fw-label) 11px/1 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.gt-axis>div,.gt-lane{position:relative;margin:0}
.gt-axis>div span{position:absolute;top:12px;padding-left:5px;white-space:nowrap}
.gt-axis>div span.gt-tick-end{padding:0 6px 0 0;transform:translateX(-100%)}
.gt-row,.gt-proj{height:52px;border-bottom:1px solid var(--border-hairline)}
.gt-row:last-child{border-bottom:0}
.gt-task{position:sticky;left:0;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;padding:6px 14px;border-right:1px solid var(--border-hairline);background:var(--bg-canvas)}
.gt-task button{display:block;width:100%;padding:0;border:0;background:none;color:var(--text-primary);font:600 12px/1.3 var(--font-sans);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.gt-task button:hover{text-decoration:underline;text-underline-offset:3px}
.gt-task small{display:flex;align-items:center;gap:5px;font-size:10.5px;line-height:1.3;color:var(--text-tertiary);overflow:hidden}
.gt-task small .gt-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gt-task .st-chip{font-size:10px;padding:1px 6px;border-radius:4px;line-height:1.4;flex:none}
/* The whole-project row sits above the phases. It's styled apart so it never counts as a phase. */
.gt-proj{background:color-mix(in srgb,var(--week-client) 6%,var(--bg-canvas))}
.gt-proj .gt-task{background:color-mix(in srgb,var(--week-client) 6%,var(--bg-canvas))}
.gt-proj .gt-task button{font-weight:650;letter-spacing:-0.005em}
.gt-pbar{position:absolute;top:19px;height:14px;min-width:8px;border:1px solid color-mix(in srgb,var(--week-client) var(--card-edge),transparent);border-radius:3px;background:color-mix(in srgb,var(--week-client) var(--bar-tint),var(--bg-canvas));box-sizing:border-box;opacity:0.85;z-index:1}
.gt-pbar span{display:block;padding:0 6px;font:600 10px/12px var(--font-sans);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-proj.is-late .gt-pbar{border-color:var(--status-danger);background:var(--status-danger-bg)}
.gt-proj.is-late .gt-pbar span{color:var(--status-danger)}
.gt-lane{background:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--gt-day) - 1px),var(--border-hairline) calc(var(--gt-day) - 1px),var(--border-hairline) var(--gt-day))}
.gt-bar{position:absolute;top:16px;height:20px;min-width:8px;border:1px solid color-mix(in srgb,var(--week-client) var(--card-edge),transparent);border-radius:5px;background:color-mix(in srgb,var(--week-client) var(--bar-tint),var(--bg-canvas));box-sizing:border-box;z-index:1}
.gt-bar span{display:block;padding:0 6px;font:600 10px/18px var(--font-sans);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-bar.is-short span{position:absolute;top:0;left:calc(100% + 6px);padding:0;overflow:visible}
.gt-bar.is-short.is-short-l span{left:auto;right:calc(100% + 6px)}
.gt-row.gt-k-review .gt-bar{border-color:var(--st-review-ink);background:var(--st-review-bg)}
.gt-row.gt-k-review .gt-bar span{color:var(--st-review-ink)}
.gt-row.gt-k-client .gt-bar{border-color:var(--st-client-ink);background:var(--st-client-bg)}
.gt-row.gt-k-client .gt-bar span{color:var(--st-client-ink)}
.gt-row.is-done .gt-bar{border-style:dashed;opacity:0.7}
.gt-row.is-done .gt-task button{color:var(--text-secondary);text-decoration:line-through;text-decoration-thickness:1px}
.gt-row.is-late .gt-bar{border-color:var(--status-danger);background:var(--status-danger-bg)}
.gt-row.is-late .gt-bar span{color:var(--status-danger)}
.gt-diamond{position:absolute;top:21px;width:10px;height:10px;background:var(--text-primary);transform:translateX(-50%) rotate(45deg);border-radius:1px}
.gt-row.is-done .gt-diamond{background:var(--text-tertiary)}
.gt-undated{position:absolute;top:18px;font-size:11px;color:var(--text-tertiary)}
.gt-today,.gt-ptoday{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--brand-red);z-index:0;pointer-events:none}
.gt-axis .gt-today{top:auto;bottom:-1px;height:6px}
.gt-axis .gt-today:after{content:'';position:absolute;left:-3px;bottom:-1px;width:5px;height:5px;border-radius:50%;background:var(--brand-red)}
.gt-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:12px 0 0}
.gt-foot p{margin:0;font-size:12px;line-height:1.5;color:var(--text-secondary);max-width:62ch}
.gt-btns{display:flex;flex-wrap:wrap;gap:8px}
.gt-btns .btn-secondary{min-height:32px;padding:0 12px}
/* Activity: a vertical rule with a dot per entry, newest first. */
.act{position:relative;margin:0;padding:0 0 0 18px;list-style:none;border-left:1px solid var(--border-strong)}
.act li{position:relative;padding:0 0 14px}
.act li:last-child{padding-bottom:2px}
.act li::before{content:'';position:absolute;left:-22px;top:5px;width:7px;height:7px;border-radius:var(--r-circle);background:var(--act-dot,var(--text-tertiary));box-shadow:0 0 0 2px var(--bg-canvas)}
.act li.is-now{--act-dot:var(--text-primary)}
.act-what{display:block;font:600 12.5px/1.4 var(--font-sans)}
.act-when{display:block;margin-top:1px;font-size:11px;color:var(--text-tertiary)}

/* Clients. One outlined card per client, the figures in the display face, the owners as avatars. */
.cg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cg-card{display:flex;flex-direction:column;gap:14px;padding:16px 18px 15px;border:1px solid color-mix(in srgb,var(--week-client) var(--card-edge),transparent);border-radius:15px;background:color-mix(in srgb,var(--week-client) var(--card-tint),var(--bg-canvas));color:var(--text-primary);text-align:left;font:inherit;transition:border-color var(--motion-fast) ease,box-shadow var(--motion-fast) ease,transform var(--motion-fast) ease}
.cg-top{display:flex;align-items:center;gap:10px}
.cg-top .st-mono{width:34px;height:34px;border-radius:10px;font-size:14px}
.cg-name{flex:1;min-width:0;overflow:hidden;font:650 15px/1.3 var(--font-sans);letter-spacing:-0.005em;text-overflow:ellipsis;white-space:nowrap}
.cg-nums{display:flex;gap:18px}
.cg-num{display:flex;flex-direction:column;gap:3px}
.cg-num .fig{font-size:28px}
.cg-num small{font:var(--fw-label) 10px/1.3 var(--font-label);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary)}
.cg-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--week-client) 30%,var(--border-hairline))}
.cg-next{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font:600 12px/1.3 var(--font-sans);color:var(--text-secondary)}
.cg-next.is-quiet{color:var(--text-tertiary)}
.cg-avs{display:flex;flex-direction:row-reverse}
.cg-avs .av-i{margin-left:-6px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--week-client,var(--text-secondary)) 32%,transparent),0 0 0 2px var(--bg-canvas)}
.cg-avs .av-i:last-child{margin-left:0}

/* Resourcing. One row per person: who, open count, this week's count, then the first three items as chips. */
.rs-panel .rs-team:last-child{margin-bottom:0}
.rs-team{margin:0 0 30px}
.rs-team-h{display:flex;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--hot-ink)}
.rs-cols,.rs-row{display:grid;grid-template-columns:168px 84px 84px minmax(0,1fr);align-items:center;gap:16px}
.rs-cols{padding:8px 0 6px;border-bottom:1px solid var(--border-hairline)}
.rs-cols span{font:var(--fw-label) 11px/1.3 var(--font-label);letter-spacing:var(--track-label-wide);text-transform:uppercase;color:var(--text-tertiary)}
.rs-rows{margin:0;padding:0;list-style:none}
.rs-row{width:calc(100% + 16px);margin:0 -8px;padding:11px 8px;border:0;border-bottom:1px solid var(--border-hairline);background:transparent;color:var(--text-primary);text-align:left;font:inherit}
.rs-who{display:flex;align-items:center;gap:10px;min-width:0;padding:0;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.rs-who .av-i{width:30px;height:30px;font-size:11px}
.rs-name{display:block;font:600 13px/1.3 var(--font-sans)}
.rs-lead{display:block;margin-top:1px;font-size:11px;color:var(--text-tertiary)}
.rs-n{display:flex;align-items:baseline;gap:5px}
.rs-n .fig{font-size:24px}
.rs-n small{font:600 11px var(--font-sans);color:var(--text-tertiary)}
.rs-n.is-heavy .fig{color:var(--status-warn)}

/* Mockup notes */

/* Agent A, step 3. Home head puts the scope toggle upper right; the note explains a picked metric. */
.hm-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px}

.hs-filter-note{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0 0 16px;padding:12px 16px;border:1px solid var(--border-hairline);border-radius:12px;background:var(--bg-canvas);font-size:13px;line-height:1.4;color:var(--text-secondary)}
